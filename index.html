<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Focus</title>
<script>/* Focus is the site root. If the user pinned Grid as home, bounce to the grid — unless ?focus=1 (the grid's ◎ Focus button) says to stay here. */
try{ if(localStorage.getItem('tb.landing')==='grid' && !/[?&]focus=/.test(location.search)) location.replace('dashboard.html'); }catch(e){}</script>
<style>
:root{ --bg:#070c10; --ink:#eaf6fb; --cyan:#39c7df; --cyan2:#1b6e80; --dim:#5e7a84; --orange:#45b8d0; --gold:#6fd0e0; --green:#3a8f5f; --line:rgba(57,199,223,.22); --panel:rgba(10,22,27,.64); }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:0;height:0} *{scrollbar-width:none}
html,body{margin:0;height:100%;background:radial-gradient(130% 120% at 50% 42%, #0b141a 0%, #070c10 60%, #04070a 100%);color:var(--ink);
  font:15px/1.4 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
textarea,input{font:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
#stage{position:fixed;inset:0;overflow:hidden;animation:bootIn .9s cubic-bezier(.2,.8,.2,1)}
@keyframes bootIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.sweep{position:absolute;pointer-events:none;z-index:1;opacity:.55;border-radius:50%;
  background:conic-gradient(from 0deg, rgba(57,199,223,.22) 0deg, rgba(57,199,223,.05) 26deg, rgba(57,199,223,0) 60deg, rgba(57,199,223,0) 360deg);
  -webkit-mask:radial-gradient(circle at center, transparent 0 24%, #000 25% 100%); mask:radial-gradient(circle at center, transparent 0 24%, #000 25% 100%);
  animation:sweepSpin 9s linear infinite; will-change:transform}
@keyframes sweepSpin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ #stage{animation:none} .sweep{animation:none;opacity:.22} }
svg.hud{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.spin{transform-origin:center;animation:spin 120s linear infinite}
.spin.rev{animation-duration:180s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.mono{font-family:ui-monospace,Menlo,monospace}
/* top bar */
.bar{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;z-index:10;
  font:600 12px ui-monospace,Menlo,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--dim);pointer-events:none}
.bar>*{pointer-events:auto}
.bar>span{min-width:0}
.bar>#greet{flex:none} .clock{flex:none}
.bar .mid{flex:1;text-align:center;color:var(--cyan);text-shadow:0 0 14px rgba(57,199,223,.5);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 14px}
.clock{font-size:15px;color:var(--ink)}
@media(max-width:720px){ .bar .mid{display:none} }
/* core */
.core{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at 50% 42%, rgba(57,199,223,.14), rgba(7,12,16,.1) 70%);
  border:1.5px solid rgba(57,199,223,.6);box-shadow:0 0 78px rgba(57,199,223,.32), inset 0 0 72px rgba(57,199,223,.14);
  padding:18px;cursor:pointer;transition:transform .3s;z-index:6}
.core:hover{transform:scale(1.03)}
/* cheap GPU breathing halo behind the core (opacity/transform only — NOT animated box-shadow) */
.corehalo{position:absolute;border-radius:50%;z-index:5;pointer-events:none;
  background:radial-gradient(circle, rgba(57,199,223,.22), rgba(57,199,223,0) 68%);animation:glowBreathe 7s ease-in-out infinite;will-change:opacity,transform}
@keyframes glowBreathe{0%,100%{opacity:.45;transform:scale(.98)}50%{opacity:.9;transform:scale(1.05)}}
.core .lbl{font:700 11px ui-monospace,Menlo,monospace;letter-spacing:4px;color:var(--cyan);text-transform:uppercase;opacity:.9}
.core .cnt{font-weight:800;font-size:12px;color:var(--dim);margin-top:2px;letter-spacing:1px}
.core .item{margin-top:12px;font-weight:700;font-size:20px;line-height:1.25;max-width:92%;transition:opacity .5s}
.core .proj{display:inline-block;font:800 11px ui-monospace,Menlo,monospace;color:#07141a;background:var(--cyan);border-radius:6px;padding:1px 7px;margin-bottom:8px;letter-spacing:.5px}
.core .empty{color:var(--dim);font-size:15px;margin-top:12px}
/* bubbles */
.bub{position:absolute;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(circle at 50% 40%, rgba(14,26,32,.92), rgba(9,16,20,.86));
  border:1px solid rgba(57,199,223,.32);box-shadow:0 0 22px rgba(0,0,0,.5), inset 0 0 26px rgba(57,199,223,.06);
  padding:10px;cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s;overflow:hidden;z-index:5}
.bub:hover{transform:scale(1.05);border-color:var(--cyan);box-shadow:0 0 30px rgba(57,199,223,.3)}
.bub .cap{font:700 10px ui-monospace,Menlo,monospace;letter-spacing:1.3px;text-transform:uppercase;color:var(--cyan);opacity:.95;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;padding:0 2px;cursor:pointer}
.bub .cap:hover{text-decoration:underline}
.bub .n{font-weight:800;font-size:11px;color:var(--dim);margin-top:1px}
.bub .it{margin-top:7px;font-weight:600;font-size:12.5px;line-height:1.22;color:var(--ink);transition:opacity .45s;max-width:100%;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bub .pr{display:inline-block;font:800 9px ui-monospace,Menlo,monospace;color:#07141a;background:var(--gold);border-radius:5px;padding:0 5px;margin-bottom:4px}
.bub.hot{border-color:rgba(57,199,223,.5)} .bub.hot .cap{color:#8fe4f4} .bub.hot .pr{background:var(--cyan)}
.bub .dots{display:flex;gap:3px;margin-top:7px;height:5px}
.bub .dots i{width:5px;height:5px;border-radius:50%;background:rgba(57,199,223,.25)} .bub .dots i.on{background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.fade{opacity:0}
/* hierarchy: urgent things pulse, empty things recede — so the glance means something */
@keyframes borderPulse{0%,100%{border-color:rgba(57,199,223,.45)}50%{border-color:#8fe4f4}}
.bub.urgent{border-color:var(--cyan);animation:borderPulse 2.8s ease-in-out infinite}
.bub.urgent .cap{color:#bdefff}
.bub.empty{opacity:.32;filter:saturate(.5)} .bub.empty:hover{opacity:.72}
.slotcard.urgent{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(57,199,223,.4),0 8px 24px rgba(0,0,0,.35)}
.pane.urgent{border-color:var(--cyan);box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 20px rgba(57,199,223,.14)}
.pslcb.urgent{border-color:var(--cyan);color:#bdefff}
.pslcb.urgent i{color:#bdefff}
@media (prefers-reduced-motion:reduce){ .bub.urgent,.core,.corehalo{animation:none} }
/* corners */
.corner{position:absolute;z-index:8;width:min(304px,33vw);display:flex;flex-direction:column;gap:10px}
.tl{top:50px;left:14px}.tr{top:50px;right:14px}.bl{bottom:14px;left:14px}.br{bottom:14px;right:14px}
.pane{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:9px 11px 10px;backdrop-filter:blur(9px);box-shadow:0 10px 30px rgba(0,0,0,.4);transition:border-color .2s}
.pane:hover{border-color:rgba(57,199,223,.4)}
.ph{display:flex;align-items:center;gap:7px;font:700 10.5px ui-monospace,Menlo,monospace;letter-spacing:1.6px;text-transform:uppercase;color:var(--cyan);margin-bottom:7px;cursor:pointer}
.ph .pn{margin-left:auto;font-weight:800;color:var(--dim);letter-spacing:1px}
.ph:hover{color:#8fe4f4}
.lrow{display:flex;align-items:center;gap:8px;padding:6px 4px;border-radius:9px;cursor:pointer;transition:background .15s}
.lrow:hover{background:rgba(57,199,223,.08)}
.lrow .dot{width:8px;height:8px;border-radius:4px;flex:none}
.lrow .lt{flex:1;min-width:0}
.lrow .ln{font-weight:600;font-size:13.5px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .lm{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .ld{font:700 11px ui-monospace,Menlo,monospace;color:var(--dim);flex:none}
.lrow .ld.o{color:var(--orange)}
.lrow .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--dim);flex:none;display:grid;place-items:center;color:transparent;font-size:14px;transition:all .15s}
.lrow .tick:hover{border-color:var(--green);color:var(--green)}
.pane .none{color:var(--dim);font-size:12.5px;padding:4px 4px 2px}
.subrow{display:flex;gap:10px}.subrow>div{flex:1;min-width:0}
.subrow h5{margin:0 0 4px;font:700 10px ui-monospace,Menlo,monospace;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);cursor:pointer}
.subrow h5:hover{text-decoration:underline}
/* iPhone-style colored morning/afternoon bubbles (revolving tasks) */
.slotcards{display:flex;gap:8px}
.slotcard{flex:1;min-width:0;border-radius:15px;padding:9px 11px;text-align:left;color:var(--ink);overflow:hidden;min-height:76px;display:flex;flex-direction:column;border:1px solid rgba(57,199,223,.32);box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 0 26px rgba(57,199,223,.05);backdrop-filter:blur(9px);transition:transform .4s cubic-bezier(.2,.8,.2,1),border-color .4s,box-shadow .4s}
.slotcard:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 24px rgba(57,199,223,.22)}
.slotcard.am{background:linear-gradient(150deg,rgba(57,199,223,.20) 0%,rgba(27,110,128,.09) 60%,rgba(9,16,20,.45) 100%)}
.slotcard.pm{background:linear-gradient(150deg,rgba(120,212,236,.17) 0%,rgba(57,160,190,.08) 60%,rgba(9,16,20,.45) 100%)}
.slotcard .sh{display:flex;align-items:center;gap:5px;font:800 11px ui-monospace,Menlo,monospace;letter-spacing:.6px;text-transform:uppercase;color:var(--cyan)}
.slotcard .se{font-size:15px}
.slotcard .sn{margin-left:auto;font-weight:800;font-size:12px;color:var(--dim)}
.slotcard .st{margin-top:8px;font-weight:700;font-size:13.5px;line-height:1.2;flex:1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink);transition:opacity .9s cubic-bezier(.2,.8,.2,1)}
.slotcard .st.fade{opacity:0}
.slotcard .sdots{display:flex;gap:3px;margin-top:6px;height:4px}
.slotcard .sdots i{width:4px;height:4px;border-radius:2px;background:rgba(57,199,223,.22);transition:background .5s} .slotcard .sdots i.on{background:var(--cyan);box-shadow:0 0 6px rgba(57,199,223,.7)}
/* quick-add bubble on a pane */
.addrow{display:flex;gap:6px;margin-top:8px}
.addrow input{flex:1;min-width:0;background:rgba(57,199,223,.06);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:7px 9px;font-size:13px;outline:none}
.addrow input:focus{border-color:var(--cyan)}
.addrow input::placeholder{color:var(--dim)}
.addrow button{flex:none;background:var(--cyan);color:#07141a;border-radius:9px;padding:0 12px;font-weight:800}
/* meeting pane */
.mpane{padding:8px 10px 9px}
.mpane .mrow{display:flex;align-items:baseline;gap:7px}
.mpane .mtime{font:800 13px ui-monospace,Menlo,monospace;color:var(--gold);flex:none}
.mpane .mtitle{font-weight:700;font-size:13px;line-height:1.2;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpane:hover .mtitle,.mpane.pin .mtitle{white-space:normal;overflow:visible}
.mpane .mwhen{color:var(--dim);font-size:11.5px;margin-top:1px}
.mpane .mloc{color:var(--dim);font-size:11.5px;margin-top:4px;max-height:0;overflow:hidden;transition:max-height .25s}
.mpane:hover .mloc,.mpane.pin .mloc{max-height:60px}
.mpane .mjoin{display:inline-flex;align-items:center;gap:5px;margin-top:7px;background:rgba(57,199,223,.14);color:var(--ink);border:1px solid var(--cyan);border-radius:9px;padding:4px 10px;font:700 11.5px ui-monospace,Menlo,monospace;letter-spacing:.5px;text-decoration:none}
.mpane .mjoin.tel{background:#1f5a34;border-color:var(--green)}
.mpane .mnext{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);max-height:0;overflow:hidden;transition:max-height .25s}
.mpane:hover .mnext,.mpane.pin .mnext{max-height:120px}
.mpane .nxlabel{font:700 9.5px ui-monospace,Menlo,monospace;letter-spacing:1px;color:var(--dim);text-transform:uppercase}
.nowtag{display:inline-block;font:800 9px ui-monospace,Menlo,monospace;letter-spacing:1px;background:var(--orange);color:#07141a;border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle}
/* universal: hover reveals the whole list, click the header holds it open (pin) */
.clist{max-height:70px;overflow:hidden;transition:max-height .35s cubic-bezier(.2,.8,.2,1)}
.pane.exp:hover .clist,.pane.pin .clist{max-height:300px;overflow:auto}
.ph.pinnable{cursor:pointer} .pane.pin{border-color:rgba(57,199,223,.5)}
.ph .pinlock{margin-left:6px;font-size:10px;color:var(--cyan);opacity:0;transition:opacity .2s} .pane.pin .ph .pinlock{opacity:1}
/* row controls — standard on every task pane: ⋮⋮ drag, ⊘ remove-from-category, ✓ done */
.lrow .grip{color:var(--dim);font-size:13px;cursor:grab;flex:none;letter-spacing:-2px;opacity:.5}
.lrow .grip:hover{opacity:1;color:var(--cyan)}
.lrow .rmcat{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);color:var(--dim);flex:none;display:grid;place-items:center;font-size:13px;background:none}
.lrow .rmcat:hover{color:var(--cyan);border-color:var(--cyan)}
.lrow.drag{opacity:.4} .lrow.over{box-shadow:inset 0 2px 0 var(--cyan)}
/* PSLC category buttons under morning / afternoon */
.pslc{display:flex;flex-wrap:wrap;gap:5px;margin-top:2px}
.pslcb{display:inline-flex;align-items:center;gap:4px;background:rgba(57,199,223,.07);border:1px solid var(--line);border-radius:999px;padding:5px 9px;font:700 10.5px ui-monospace,Menlo,monospace;letter-spacing:.3px;color:var(--ink)}
.pslcb:hover{border-color:var(--cyan);color:var(--cyan)}
.pslcb i{font-style:normal;color:var(--dim);font-weight:800}
.pslcb.empty{opacity:.4}
/* slot-card full list (revealed on hover / pin) */
.slotcard .st{cursor:pointer}
.slotfull{max-height:0;overflow:hidden;transition:max-height .35s cubic-bezier(.2,.8,.2,1)}
.slotcard:hover .slotfull,.slotcard.pin .slotfull{max-height:220px;overflow:auto;margin-top:7px;border-top:1px solid rgba(57,199,223,.2);padding-top:5px}
.slotcard:hover .sdots,.slotcard.pin .sdots{display:none}
.slotcard .slotfull .lrow{padding:5px 2px;gap:7px}
.slotcard .slotfull .lrow .grip,.slotcard .slotfull .lrow .rmcat,.slotcard .slotfull .lrow .ld,.slotcard .slotfull .lrow .lm{display:none}
.slotcard .slotfull .lrow .lt{flex:1;min-width:0}
.slotcard .slotfull .ln{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;-webkit-line-clamp:unset}
.slotcard .slotfull .lrow .tick{width:22px;height:22px;font-size:12px}
.slotcard .sh{cursor:pointer}
.slotcard .pinlock{margin-left:4px;font-size:8px;color:var(--cyan);opacity:0;transition:opacity .2s} .slotcard.pin .pinlock{opacity:1}
.slotcard.pin{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(57,199,223,.5),0 8px 24px rgba(0,0,0,.35)}
/* orbit bubble hover-expand popover — same full list + row controls as the panes */
#pop{position:fixed;z-index:1000;isolation:isolate;width:264px;max-height:min(360px,72vh);display:none;flex-direction:column;background:linear-gradient(180deg,rgba(12,23,29,.97),rgba(7,15,20,.97));border:1px solid rgba(57,199,223,.4);border-radius:16px;box-shadow:0 16px 46px rgba(0,0,0,.55),0 0 30px rgba(57,199,223,.12);backdrop-filter:blur(10px);overflow:hidden;opacity:0;transform:scale(.97);transition:opacity .18s,transform .18s}
#pop.show{display:flex;opacity:1;transform:scale(1)}
#pop.pin{border-color:var(--cyan);box-shadow:0 16px 46px rgba(0,0,0,.55),0 0 0 1px var(--cyan)}
#pop .poph{display:flex;align-items:center;gap:7px;padding:10px 12px;border-bottom:1px solid var(--line);font:700 11px ui-monospace,Menlo,monospace;letter-spacing:1.4px;text-transform:uppercase;color:var(--cyan)}
#pop .poph .pn{margin-left:auto;color:var(--dim)}
#pop .popb{overflow:auto;padding:4px 8px 8px}
#pop .lrow{padding:7px 4px;border-bottom:1px solid rgba(57,199,223,.08)} #pop .lrow:last-child{border-bottom:0}
/* weather */
.wxstrip{display:flex;gap:3px}
.wxc{flex:1;text-align:center;border-radius:5px;padding:2px 1px;background:rgba(57,199,223,.05)}
.wxc.today{box-shadow:inset 0 0 0 1px var(--cyan)}
.wxc.wet{background:rgba(57,199,223,.15)}
.wxc .wd{font:700 7px ui-monospace,Menlo,monospace;color:var(--dim)}
.wxc .we{font-size:11px;line-height:1.05}
.wxc .wt{font-weight:800;font-size:9.5px}
.wxc .wp{font:600 6.5px ui-monospace,Menlo,monospace;color:var(--gold);min-height:7px}
.wt.hot{color:#8ecec9}.wt.cold{color:#6fb2d6}
.wxmore{display:flex;gap:3px;max-height:0;overflow:hidden;transition:max-height .28s;margin-top:0}
.wxpane:hover .wxmore{max-height:60px;margin-top:3px}
#cTR{width:min(250px,27vw)}
#cBL{width:min(200px,24vw)}
.wxpane{padding:6px 7px}
.wxpane .ph{margin-bottom:5px}
/* notes */
.npane textarea{width:100%;height:170px;resize:none;background:rgba(57,199,223,.05);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.45;outline:none}
.npane textarea:focus{border-color:var(--cyan)}
.npane .nnav{margin-left:auto;display:flex;align-items:center;gap:3px}
.npane .nnav button{color:var(--cyan);padding:0 5px;font-size:15px;line-height:1}
.npane .nnav button:disabled{opacity:.3}
.npane .nnav .nlbl{font:700 9.5px ui-monospace,Menlo,monospace;color:var(--ink);min-width:54px;text-align:center;letter-spacing:0;text-transform:none}
.npane .nnav .nlbl.past{color:var(--gold)}
.npane .nnav .nday{font:700 9px ui-monospace,Menlo,monospace;color:var(--cyan);border:1px solid var(--line);border-radius:7px;padding:2px 6px}
.npane .nfoot{display:flex;align-items:center;gap:8px;margin-top:6px;font:600 11px ui-monospace,Menlo,monospace;color:var(--dim)}
.npane .nfoot button{color:var(--cyan)}
#cBR{width:min(262px,28vw)}
/* overlay (task edit + list panes) */
/* ⌘K command bar */
#cmd{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;background:rgba(3,7,10,.62);backdrop-filter:blur(6px);padding:13vh 16px 20px}
#cmd.show{display:flex}
.cmdbox{width:min(620px,94vw);max-height:76vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#0c171d,#070f14);border:1px solid rgba(57,199,223,.45);border-radius:16px;box-shadow:0 22px 64px rgba(0,0,0,.6),0 0 42px rgba(57,199,223,.16);overflow:hidden}
.cmdin{display:flex;align-items:center;gap:11px;padding:15px 17px;border-bottom:1px solid var(--line);flex:none}
.cmdin>span{color:var(--cyan);font:800 15px ui-monospace,Menlo,monospace}
.cmdin input{flex:1;background:transparent;border:0;outline:none;color:var(--ink);font-size:18px}
.cmdin input::placeholder{color:var(--dim)}
.cmdres{overflow:auto;padding:6px}
.cmdrow{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer}
.cmdrow.sel{background:rgba(57,199,223,.15)}
.cmdrow .k{font:800 9.5px ui-monospace,Menlo,monospace;letter-spacing:1px;color:#07141a;background:var(--cyan);border-radius:5px;padding:2px 6px;text-transform:uppercase;flex:none}
.cmdrow .k.g{background:rgba(57,199,223,.18);color:var(--cyan)}
.cmdrow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cmdrow .d{color:var(--dim);font-size:12px;flex:none}
.cmdrow .dot{width:8px;height:8px;border-radius:4px;flex:none}
.cmdhint{padding:9px 15px;color:var(--dim);font:600 11px ui-monospace,Menlo,monospace;border-top:1px solid var(--line);flex:none}
#ov{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(3,7,10,.74);backdrop-filter:blur(7px);padding:20px}
#ov.show{display:flex}
.ovcard{width:min(580px,94vw);max-height:90vh;display:flex;flex-direction:column;background:linear-gradient(180deg,#0c171d,#070f14);border:1px solid rgba(57,199,223,.42);border-radius:22px;box-shadow:0 0 70px rgba(57,199,223,.2);overflow:hidden}
.ovh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font:700 12px ui-monospace,Menlo,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--cyan)}
.ovh .x{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--dim);font-size:16px;display:grid;place-items:center}
.ovh .x:hover{color:var(--cyan);border-color:var(--cyan)}
.ovbody{overflow:auto;padding:18px}
/* edit card */
.ed .proj{display:inline-block;font:800 11px ui-monospace,Menlo,monospace;color:#07141a;background:var(--orange);border-radius:6px;padding:2px 9px;letter-spacing:.5px;margin-bottom:12px}
.ed .name{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);font-size:22px;font-weight:700;line-height:1.3;padding:4px 2px 10px;resize:none;outline:none}
.ed .name:focus{border-color:var(--cyan)}
.ed .meta{color:var(--dim);font-size:12.5px;margin:12px 2px}
.ed .lbl{font:700 10px ui-monospace,Menlo,monospace;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin:14px 2px 7px}
.secchips{display:flex;flex-wrap:wrap;gap:7px}
.secchip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;color:var(--ink);background:rgba(57,199,223,.05)}
.secchip:hover{border-color:var(--cyan)}
.secchip.on{background:var(--cyan);border-color:var(--cyan);color:#07141a}
.edact{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:20px}
.edact button{min-height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.5px;background:rgba(57,199,223,.06);border:1px solid var(--line);color:var(--ink)}
.edact button .ei{font-size:20px}
.edact button:hover{border-color:var(--cyan)}
.edact .done{background:var(--green);border-color:var(--green);color:#fff}
.edact .del{color:var(--orange)}.edact .del:hover{border-color:var(--orange)}
.edlink{display:inline-flex;align-items:center;gap:6px;margin-top:16px;color:var(--cyan);text-decoration:none;font-weight:700;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:8px 14px}
/* list pane overlay */
.plist .lrow{padding:11px 10px;border-bottom:1px solid var(--line);gap:11px}
.plist .lrow:last-child{border-bottom:0}
.plist .lrow .ln{font-size:15.5px;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.plist .lrow .lm{font-size:12px}
.plist .lrow .tick{width:30px;height:30px;font-size:15px}
.plist .grip{color:var(--dim);font-size:15px;cursor:grab;flex:none;letter-spacing:-2px;opacity:.5}
.plist .lrow.drag{opacity:.4}
.plist .lrow.over{box-shadow:inset 0 2px 0 var(--cyan)}
.plist .none{color:var(--dim);text-align:center;padding:40px 10px}
.phint{color:var(--dim);font:600 11px ui-monospace,Menlo,monospace;letter-spacing:.5px;padding:0 2px 10px}
/* bottom controls */
.botc{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:8px}
.botc button,.botc a{background:none;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:600 11px ui-monospace,Menlo,monospace;letter-spacing:2px;cursor:pointer;text-decoration:none}
.botc button:hover,.botc a:hover{color:var(--cyan);border-color:var(--cyan)}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#0c1a20;border:1px solid var(--cyan);color:var(--ink);border-radius:12px;padding:10px 16px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#setup{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:30;background:rgba(4,7,10,.9)}
#setup input{background:#0d1a20;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px 12px;width:min(420px,86vw);font:14px ui-monospace,Menlo}
#setup button{background:var(--cyan);border:0;color:#07141a;font-weight:800;border-radius:8px;padding:10px 18px;cursor:pointer}
.hint{color:var(--dim);font-size:12px}
@media(max-width:860px){ .corner{width:40vw} .bl{bottom:58px} .br{bottom:58px} }
@media(max-width:620px){ .corner{position:static;width:auto} }

/* rows can never overlap: title column shrinks, age + buttons keep their own space */
.lrow[data-id]{display:grid!important;grid-template-columns:auto auto minmax(0,1fr) auto auto auto;align-items:center}
.lrow .lt{min-width:0;overflow:hidden}.lrow .ln,.lrow .lm{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slotcard .slotfull .lrow[data-id]{grid-template-columns:auto minmax(0,1fr) auto}
.corner{z-index:8;isolation:isolate}
/* ── call someone ── */
.cxpane{padding:10px!important}.cxb{max-height:min(260px,30vh);overflow:auto;margin-top:6px}
.cxr{display:flex;align-items:center;gap:6px;padding:6px 2px;border-bottom:1px solid rgba(57,199,223,.08)}
.cxn{flex:1;min-width:0;display:flex;flex-direction:column}.cxn b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cxn i{font-style:normal;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cxc,.cxt{flex:none;font-size:11.5px;font-weight:800;text-decoration:none;border-radius:7px;padding:4px 8px}
.cxc{background:#30D158;color:#0b1a10}.cxt{border:1px solid var(--line);color:#cfeaf1}
.cxh{font:700 10px ui-monospace,Menlo,monospace;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin:2px 0 6px}
.cxf{display:flex;flex-wrap:wrap;gap:5px}.cxchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 9px;font-size:12px}.cxchip .cxc,.cxchip .cxt{padding:2px 6px;font-size:10.5px}
.cxlk{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.cxlk a,.cxlk button{font-size:11.5px;font-weight:700;border:1px solid var(--line);border-radius:7px;padding:4px 8px;color:#cfeaf1;text-decoration:none}.cxlk button{color:#62e08a}
/* ── filter rail ── */
.rail{padding:10px!important}
.rail .rq{width:100%;box-sizing:border-box;background:rgba(20,36,42,.85);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:8px 10px;font-size:13px;outline:none}
.rail .rq:focus{border-color:var(--cyan)}
.rail .rres{max-height:220px;overflow:auto;margin-top:6px}
.rtabs{display:flex;gap:2px;margin:8px 0 6px;border:1px solid var(--line);border-radius:9px;padding:2px}
.rtab{flex:1;padding:5px 0;border-radius:7px;font:700 10px ui-monospace,Menlo,monospace;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.rtab.on{background:rgba(57,199,223,.16);color:var(--cyan)}
.rchips{display:flex;flex-wrap:wrap;gap:5px;max-height:min(220px,26vh);overflow:auto}
.rchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:12px;color:#cfeaf1;background:rgba(57,199,223,.05);max-width:100%}
.rchip:hover{border-color:var(--cyan);color:#eaf6fb}
.rchip i{width:7px;height:7px;border-radius:50%;flex:none}.rchip b{color:var(--dim);font:800 10.5px ui-monospace,Menlo,monospace}
</style></head>
<body>
<div id="stage">
  <canvas class="fx" id="fx"></canvas>
  <svg class="hud" id="hud" preserveAspectRatio="xMidYMid meet"></svg>
  <div class="sweep" id="sweep"></div>
  <div class="bar"><span id="greet">FOCUS</span><span class="mid" id="status">LOADING…</span><span class="clock" id="clock"></span></div>
  <!-- corners -->
  <div class="corner tl" id="cTL"></div>
  <div class="corner tr" id="cTR"></div>
  <div class="corner bl" id="cBL"></div>
  <div class="corner br" id="cBR"></div>
</div>
<div id="setup">
  <div class="hint">Paste your Airtable key to see live data (or just preview the demo).</div>
  <input id="keyin" type="password" placeholder="Airtable Personal Access Token (pat…)">
  <div style="display:flex;gap:8px"><button id="keygo">Connect</button><button id="demo" style="background:#13232b;color:var(--cyan)">Preview demo</button></div>
  <div class="hint">It reuses the same key your dashboard already saved — you usually won't see this.</div>
</div>
<div class="botc">
  <button id="cmdBtn" title="Add / jump / search (⌘K)">⌘ ADD · JUMP</button>
  <button id="reset">⟲ RESET LAYOUT</button>
  <button id="homeToggle"></button>
  <a href="dashboard.html">⌂ DASHBOARD</a>
</div>
<div id="ov"><div class="ovcard"><div class="ovh" id="ovh"></div><div class="ovbody" id="ovbody"></div></div></div>
<div id="cmd"><div class="cmdbox"><div class="cmdin"><span>⌘</span><input id="cmdInp" placeholder="Add a task, jump to a list, or search everything…" autocomplete="off"></div><div class="cmdres" id="cmdRes"></div><div class="cmdhint">↑↓ move · ⏎ select · esc close · type then ⏎ to add a task</div></div></div>
<div id="toast"></div>
<script src="task-editor.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const flat=v=>{if(v==null)return'';if(Array.isArray(v))return v.map(x=>x&&typeof x==='object'?(x.name||''):x).filter(Boolean).join(', ');if(typeof v==='object')return v.name||'';return String(v);};
function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const todayISO=()=>isoOf(new Date());
const tomorrowISO=()=>{const d=new Date();d.setDate(d.getDate()+1);return isoOf(d);};
const cleanName=t=>(t.name||'').replace(/\s*\(V\d+-\d+\)\s*$/i,'').trim()||'(untitled)';
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
let cfg={}; try{cfg=JSON.parse(localStorage.getItem('tb.cfg')||'{}');}catch(e){}
cfg.baseId=cfg.baseId||'appdDTNBbVrp6hVOv'; cfg.tableId=cfg.tableId||'tblLpOdHqxoP3siYk';
let aug={}; try{aug=JSON.parse(localStorage.getItem('tb.aug')||'{}');}catch(e){}
const A=id=>aug[id]||(aug[id]={});
const saveAug=()=>SV('tb.aug',aug);
const CAL_TABLE='tblTL2OeN8b1k2J8W', RESPOND_TABLE='tblcpvr8BdkjSutU2', DN_TABLE='tblfAeWMfvocVGxZk';
const atUrl=()=>'https://api.airtable.com/v0/'+cfg.baseId+'/'+encodeURIComponent(cfg.tableId);
let tasks=[], calendar=[], respond=[], wx=LS('m.wx',[]);
let order=LS('tb.radialOrder',{});
const saveOrder=()=>SV('tb.radialOrder',order);
let radPos={}; try{radPos=JSON.parse(localStorage.getItem('tb.radialPos')||'{}');}catch(e){}
function savePos(k,fx,fy){ radPos[k]={x:fx,y:fy}; SV('tb.radialPos',radPos); }
let demo=false;
const daysOpen=t=>t.createdTime?Math.floor((Date.now()-new Date(t.createdTime))/864e5):0;
function sectionOf(t){ const a=A(t.id); return (a.section||t.sectionRemote||'').toLowerCase()||defaultSection(t); }
function defaultSection(t){ if(t.slotRemote==='morning')return'morning'; if(t.slotRemote==='afternoon')return'afternoon'; if(t.typeRemote==='call'||/^\s*call\b/i.test(t.name||''))return'calls'; return'backlog'; }
const isOpen=t=>(t.status||'Open')==='Open';
const snoozed=t=>A(t.id).snoozeUntil>Date.now();
const live=t=>isOpen(t)&&!snoozed(t)&&sectionOf(t)!=='parked';
function score(t){ return (t.priorityRemote||0)+(A(t.id).priAdj||0)+daysOpen(t); }
const PAL=['#39c7df','#5eead4','#67E8F9','#60A5FA','#A78BFA','#818CF8','#34D399','#2dd4bf','#7dd3fc','#c4b5fd','#4ADE80','#38bdf8'];
const projColor=p=>{ if(!p) return '#5e7a84'; let h=0; for(const c of String(p).toUpperCase()) h=(h*31+c.charCodeAt(0))>>>0; return PAL[h%PAL.length]; };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),1800); }

/* ---- category catalog ---- */
const CAT={ focus:['◎','Now / Focus'], priority:['🔥','Priority'], meeting:['📅','Meeting'], respond:['✍️','Respond'],
  calls:['📞','Calls'], morning:['🌅','Morning'], afternoon:['☀️','Afternoon'], incoming:['📥','Incoming'],
  nextup:['⏭','Next Up'], bigticket:['🏔','Big Tix'], sunday:['📆','Sunday'], backlog:['🗂','Backlog'], still:['⏳','Still Open'] };
// sections a task can be moved to from the edit card
const SECTIONS=[['focus','◎ Focus'],['morning','🌅 Morning'],['afternoon','☀️ Afternoon'],['calls','📞 Calls'],['nextup','⏭ Next Up'],['bigticket','🏔 Big Tix'],['sunday','📆 Sunday'],['backlog','🗂 Backlog'],['parked','🅿️ Parked']];

const hasStale=list=>Array.isArray(list)&&list.some(t=>t&&!t._mtg&&daysOpen(t)>=14);
function applyOrder(key,list){ const o=order[key]||[]; const ix=id=>{const i=o.indexOf(id);return i<0?1e9:i;}; return list.slice().sort((a,b)=>ix(a.id)-ix(b.id)); }
let _ifCache={};
function itemsFor(key){ if(key in _ifCache) return _ifCache[key]; return (_ifCache[key]=_computeItems(key)); }
function clearIF(){ _ifCache={}; }
function _computeItems(key){
  const L=sec=>tasks.filter(t=>live(t)&&sectionOf(t)===sec);
  switch(key){
    case 'focus': return applyOrder('focus',L('focus'));
    case 'nextup': return tasks.filter(t=>live(t)&&(t.nextUp||sectionOf(t)==='nextup')).sort((a,b)=>((a.nuOrder??1e9)-(b.nuOrder??1e9)));
    case 'priority': return applyOrder('priority', tasks.filter(t=>live(t)&&!A(t.id).notPriority).sort((a,b)=>score(b)-score(a)).slice(0,15));
    case 'incoming': return applyOrder('incoming', L('incoming'));
    case 'still': return applyOrder('still', tasks.filter(t=>live(t)&&daysOpen(t)>=10&&!t.project&&!t.lead).sort((a,b)=>daysOpen(b)-daysOpen(a)));
    case 'morning': case 'afternoon': case 'calls': return applyOrder(key, L(key).sort((a,b)=>daysOpen(a)-daysOpen(b))); // oldest last
    case 'respond': return respond;
    case 'meeting': return todayMtgItems();
    default: return applyOrder(key,L(key));
  }
}
const ORBIT=['priority','respond','calls','nextup','bigticket','sunday','backlog','still'];
const PSLC=['calls','priority','nextup','bigticket','sunday','backlog','respond','still'];

/* ---- meetings ---- */
const CONF_TEL='tel:+19172683365', CONF_ROOM='https://meetings.dialpad.com/room/rbenjamini';
const CONF_CALLS=[[510,540,'🌅 8:30 conference call','8:30–9:00 AM'],[900,930,'☀️ Afternoon call','3:00–3:30 PM']];
function mtgEnd(e){ const m=String(e.when||'').split(/[–—-]/)[1]; if(m){ const r=m.match(/(\d{1,2})(?::(\d\d))?\s*(AM|PM)?/i); if(r){ let h=+r[1]%12, mm=+(r[2]||0); const ap=(r[3]||'').toUpperCase(); if(ap==='PM'||(!ap&&h<7)) h+=12; const v=h*60+mm; if(v>(e.sort||0)) return v; } } return (e.sort||0)+30; }
function meetingsToday(day){
  const list=calendar.filter(e=>e.date===day).map(e=>Object.assign({},e,{start:+e.sort||0,end:mtgEnd(e)}));
  const dw=new Date(day+'T12:00:00').getDay();
  if(dw>=1&&dw<=5){ CONF_CALLS.forEach(([s,e,t,when])=>{ const isDp=x=>/dialpad/i.test((x.link||'')+' '+(x.location||''));
    const hit=list.find(x=>x.start<e&&x.end>s)||list.find(x=>isDp(x)&&Math.abs(x.start-s)<=90);
    if(hit){ if(!hit.link||isDp(hit)||/^tel:/i.test(hit.link)){ hit.link=CONF_ROOM; hit.dial=CONF_TEL; hit.conf=1; } return; }
    list.push({title:t,when,date:day,sort:s,start:s,end:e,location:'Dialpad · dial-in 917-268-3365 (no PIN)',link:CONF_ROOM,dial:CONF_TEL,conf:1}); }); }
  return list.sort((a,b)=>a.start-b.start);
}
function nowNext(day){ const d=new Date(), cur=d.getHours()*60+d.getMinutes(); const L=meetingsToday(day);
  const now=L.filter(e=>e.start-5<=cur&&cur<e.end); const next=L.find(e=>e.start>cur&&!now.includes(e)); return {now:now[0]||null,next:next||null,cur,L}; }
function joinHref(e){ if(e.link&&/^(https?:|tel:)/i.test(e.link)) return e.link; const digits=(e.location||'').replace(/[^\d]/g,''); return digits.length>=10?'tel:'+digits:''; }
const todayMtgItems=()=>meetingsToday(todayISO()).map(e=>({_mtg:true,name:e.title,when:e.when,link:joinHref(e)}));

/* ---- weather ---- */
const WX_URL='https://api.open-meteo.com/v1/forecast?latitude=40.7128&longitude=-74.0060&daily=precipitation_sum,weathercode,temperature_2m_max&timezone=America/New_York&forecast_days=10&precipitation_unit=inch&temperature_unit=fahrenheit';
function wxEmoji(c){ if(c===0) return '☀️'; if(c>=95) return '⛈️'; if((c>=71&&c<=77)||c===85||c===86) return '❄️'; if((c>=61&&c<=67)||c===82) return '🌧️'; if((c>=51&&c<=57)||c===80||c===81) return '🌦️'; return '🌥️'; }
async function fetchWx(){ try{ const r=await fetch(WX_URL); if(!r.ok) return; const d=await r.json(); const D=d.daily;
  wx=D.time.map((t,i)=>({date:t,code:D.weathercode[i],hi:Math.round(D.temperature_2m_max[i]),pr:+D.precipitation_sum[i]||0})); SV('m.wx',wx); renderCorners(); }catch(e){} }

/* ---- notes (day-based, same AppNotes store + feel as the dashboard 🗒 Notes pane) ---- */
let noteDay=null, noteRids={};   // noteDay null = today
const dnLabel=day=>day===todayISO()?'Today':new Date(day+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const dnShift=(day,n)=>{ const d=new Date(day+'T12:00:00'); d.setDate(d.getDate()+n); return isoOf(d); };
const dnGet=()=>LS('m.days',{});
const dnPut=(day,txt)=>{ const L=LS('m.days',{}); L[day]=txt; SV('m.days',L); };
function setNoteStat(s){ const el=$('#noteSt'); if(!el)return; const now=new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  const isToday=(noteDay||todayISO())===todayISO();
  el.textContent = s==='saving'?'saving…' : s==='saved'?('✓ Saved '+now) : s==='error'?'⚠︎ not saved — retry' : s==='local'?'✓ Saved on this device' : (isToday?'new page every day':'archived day'); }
async function loadNoteDay(day){ const ta=$('#noteTa'); const L=dnGet(); if(ta&&ta.dataset.day===day&&document.activeElement!==ta) ta.value=L[day]||'';
  if(demo||!cfg.apiKey){ setNoteStat('init'); return; }
  try{ const u=new URL('https://api.airtable.com/v0/'+cfg.baseId+'/'+DN_TABLE); u.searchParams.set('pageSize','1'); u.searchParams.set('filterByFormula',"{Key}='scratch:"+day+"'");
    const r=await fetch(u,{headers:{Authorization:'Bearer '+cfg.apiKey}}); if(!r.ok) return; const d=await r.json(); const rec=(d.records||[])[0];
    if(rec){ noteRids[day]=rec.id; const txt=rec.fields.Text||''; dnPut(day,txt); const t2=$('#noteTa'); if(t2&&t2.dataset.day===day&&document.activeElement!==t2) t2.value=txt; }
    setNoteStat('init'); }catch(e){} }
async function saveNoteDay(day,text){ dnPut(day,text); if(demo||!cfg.apiKey){ setNoteStat('local'); return; }
  const body={fields:{Key:'scratch:'+day,Text:text,Updated:new Date().toLocaleString()}}; const H={Authorization:'Bearer '+cfg.apiKey,'Content-Type':'application/json'};
  try{ if(noteRids[day]){ const r=await fetch('https://api.airtable.com/v0/'+cfg.baseId+'/'+DN_TABLE+'/'+noteRids[day],{method:'PATCH',headers:H,body:JSON.stringify(body)}); setNoteStat(r.ok?'saved':'error'); }
    else { const r=await fetch('https://api.airtable.com/v0/'+cfg.baseId+'/'+DN_TABLE,{method:'POST',headers:H,body:JSON.stringify({records:[body],typecast:true})}); if(r.ok){ const d=await r.json(); noteRids[day]=d.records[0].id; setNoteStat('saved'); } else setNoteStat('error'); } }catch(e){ setNoteStat('error'); } }

/* ---- fetch all ---- */
async function fetchAll(){
  if(!cfg.apiKey){ demo=true; demoData(); $('#status').textContent='DEMO'; return render(); }
  $('#status').textContent='SYNCING…';
  try{
    let out=[],off,g=0;

/* ── Call someone (same as the iPhone): contacts search · Call (tel: → iPhone/FaceTime) / Text (sms: → Messages) ·
   Gmail / Web / Ask Claude / + Save number fallbacks · Frequent chips when empty. Usage → Airtable ContactUsage (shared). ── */
const CX_TABLE='tbla8W2IjHCJMXgY5', CU_TABLE='tblxPMZa78C8n0U4t', CU_HALF=14*864e5;
let cxContacts=(()=>{ try{ return JSON.parse(localStorage.getItem('contacts')||localStorage.getItem('m.contacts')||'[]'); }catch(e){ return []; } })();
let cxQ='', cuRows=[], cuAt=0, cxBusy=false;
const cxKey=p=>String(p||'').replace(/\D/g,'').slice(-10);
function cxLoad(){ if(cxBusy||demo||!cfg.apiKey) return; const fresh=Date.now()-(+localStorage.getItem('tb.contacts.ts')||0)<12*36e5; cxBusy=true;
  const jobs=[];
  if(!cxContacts.length||!fresh){ const u=new URL('https://api.airtable.com/v0/'+cfg.baseId+'/'+CX_TABLE); u.searchParams.set('pageSize','100');
    jobs.push(fetch(u,{headers:{Authorization:'Bearer '+cfg.apiKey}}).then(r=>r.ok?r.json():null).then(d=>{ if(d&&d.records&&d.records.length){ const rows=d.records.map(r=>({i:+flat(r.fields.Idx)||0,d:flat(r.fields.Data)||''})).sort((a,b)=>a.i-b.i);
      try{ const arr=JSON.parse(rows.map(r=>r.d).join('')); if(arr.length){ cxContacts=arr; localStorage.setItem('contacts',JSON.stringify(arr)); localStorage.setItem('tb.contacts.ts',String(Date.now())); } }catch(e){} } }).catch(()=>{})); }
  if(Date.now()-cuAt>30*6e4){ const u=new URL('https://api.airtable.com/v0/'+cfg.baseId+'/'+CU_TABLE); u.searchParams.set('pageSize','100');
    jobs.push(fetch(u,{headers:{Authorization:'Bearer '+cfg.apiKey}}).then(r=>r.ok?r.json():null).then(d=>{ if(d&&d.records){ cuRows=d.records.map(x=>({id:x.id,name:x.fields.Name||'',phone:x.fields.Phone||'',count:+x.fields.Count||0,score:+x.fields.Score||0,last:x.fields.LastUsed?Date.parse(x.fields.LastUsed):0,pinned:!!x.fields.Pinned,hidden:!!x.fields.Hidden})); cuAt=Date.now(); } }).catch(()=>{})); }

function cxSearch(q){ q=q.toLowerCase(); const dq=q.replace(/\D/g,''); const out=[]; for(const c of cxContacts){ const hit=(c.n||'').toLowerCase().includes(q)||(c.o||'').toLowerCase().includes(q)||(dq.length>=3&&(c.p||[]).some(p=>String(p).replace(/\D/g,'').includes(dq))); if(hit&&(c.p||[]).length){ out.push(c); if(out.length>=8) break; } } return out; }
const cuNow=r=>r.score*Math.pow(0.5,(Date.now()-r.last)/CU_HALF);
async function cxUse(name,phone){ const k=cxKey(phone); if(k.length<7||demo||!cfg.apiKey) return; const base='https://api.airtable.com/v0/'+cfg.baseId+'/'+CU_TABLE, H={Authorization:'Bearer '+cfg.apiKey,'Content-Type':'application/json'};
  try{ const u=new URL(base); u.searchParams.set('filterByFormula',"{Key}='"+k+"'"); u.searchParams.set('maxRecords','1'); const d=await fetch(u,{headers:H}).then(r=>r.ok?r.json():{records:[]}); const f=((d.records||[])[0]||{}).fields||{};

    await fetch(base,{method:'PATCH',headers:H,body:JSON.stringify({performUpsert:{fieldsToMergeOn:['Key']},typecast:true,records:[{fields}]})}); cuAt=0; }catch(e){} }
const cxRow=(n,o,p)=>{ const d=String(p).replace(/[^\d+]/g,''); return `<div class="cxr"><span class="cxn"><b>${esc(n||p)}</b>${o?`<i>${esc(o)}</i>`:''}<i>${esc(p)}</i></span><a class="cxc" href="tel:${esc(d)}" data-cu="${esc(n||'')}" title="Call (iPhone / FaceTime)">Call</a><a class="cxt" href="sms:${esc(d)}" data-cu="${esc(n||'')}" title="Text (Messages)">Text</a></div>`; };

/* ====== ⌘K command bar — add / jump / search from anywhere ====== */
const cmd=$('#cmd'), cmdInp=$('#cmdInp'), cmdRes=$('#cmdRes'); let cmdItems=[], cmdSel=0;
function openCmd(){ cmd.classList.add('show'); cmdInp.value=''; buildCmd(''); setTimeout(()=>cmdInp.focus(),0); }
function closeCmd(){ cmd.classList.remove('show'); }
cmd.addEventListener('click',e=>{ if(e.target===cmd) closeCmd(); });
function buildCmd(q){ q=(q||'').trim(); const ql=q.toLowerCase(); cmdItems=[]; cmdSel=0;
  if(q) cmdItems.push({type:'add',label:'Add “'+q+'”',sub:'→ Incoming',run:()=>{ createTask('incoming',q); closeCmd(); }});
  if(!ql||'focus now'.includes(ql)) cmdItems.push({type:'jump',label:'◎ Now / Focus',sub:itemsFor('focus').length+' items',run:()=>{closeCmd();openList('focus');}});
  Object.keys(CAT).filter(k=>k!=='focus').forEach(k=>{ const cap=CAT[k][1]; if(!ql||cap.toLowerCase().includes(ql)){ const n=itemsFor(k).length; cmdItems.push({type:'jump',label:CAT[k][0]+' '+cap,sub:n+' item'+(n===1?'':'s'),run:()=>{closeCmd();openList(k);}}); } });
  if(ql){ const hits=tasks.filter(t=>live(t)&&(((t.name||'').toLowerCase().includes(ql))||((t.project||'').toLowerCase().includes(ql)))).slice(0,8);
    hits.forEach(t=>cmdItems.push({type:'task',label:cleanName(t),sub:t.project||'',color:projColor(t.project),run:()=>{closeCmd();openTask(t.id);}})); }
  renderCmd();
}
function renderCmd(){ cmdRes.innerHTML=cmdItems.map((it,i)=>{
    const k=it.type==='add'?'<span class="k">add</span>':it.type==='jump'?'<span class="k g">go</span>':'<span class="dot" style="background:'+(it.color||'var(--cyan)')+'"></span>';
    return '<div class="cmdrow'+(i===cmdSel?' sel':'')+'" data-i="'+i+'">'+k+'<span class="t">'+esc(it.label)+'</span>'+(it.sub?'<span class="d">'+esc(it.sub)+'</span>':'')+'</div>';
  }).join('')||'<div class="cmdrow"><span class="t" style="color:var(--dim)">Type to search or add…</span></div>';
  cmdRes.querySelectorAll('.cmdrow[data-i]').forEach(r=>{ r.onclick=()=>{ const it=cmdItems[+r.dataset.i]; if(it&&it.run)it.run(); }; r.onmousemove=()=>{ if(cmdSel!==+r.dataset.i){ cmdSel=+r.dataset.i; markCmdSel(); } }; });
}
function markCmdSel(){ cmdRes.querySelectorAll('.cmdrow').forEach((r,i)=>r.classList.toggle('sel',i===cmdSel)); }
function scrollCmdSel(){ const r=cmdRes.querySelectorAll('.cmdrow')[cmdSel]; if(r)r.scrollIntoView({block:'nearest'}); }
cmdInp.addEventListener('input',()=>buildCmd(cmdInp.value));
cmdInp.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); cmdSel=Math.min(cmdItems.length-1,cmdSel+1); markCmdSel(); scrollCmdSel(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); cmdSel=Math.max(0,cmdSel-1); markCmdSel(); scrollCmdSel(); }
  else if(e.key==='Enter'){ e.preventDefault(); const it=cmdItems[cmdSel]; if(it&&it.run)it.run(); }
  else if(e.key==='Escape'){ e.preventDefault(); closeCmd(); }
});
addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){ e.preventDefault(); cmd.classList.contains('show')?closeCmd():openCmd(); return; }
  if(e.key==='/'&&!cmd.classList.contains('show')&&!/^(input|textarea)$/i.test((e.target&&e.target.tagName)||'')&&!(e.target&&e.target.isContentEditable)){ e.preventDefault(); openCmd(); }
});

const TE_CATS=[['',''],['morning',''],['afternoon',''],['calls',''],['incoming',''],['focus',''],['@Computer – Claude',''],['Open Items',''],['parked','']];
const TE_KEYS={Task:'name',Project:'project',SBLead:'lead',Sub:'sub',Status:'status',Priority:'priorityRaw',DoDate:'doDate',ReminderAt:'remindAt',NextStep:'next',Notes:'notes',CallContact:'callWho',Phone:'phone',RoniFlag:'flag',NextUp:'nextUp',TextExclude:'textEx',NextUpOrder:'nuOrder'};

  get:(t,f)=>{ const v=t[TE_KEYS[f]]; return v==null?'':v; },

  cat:t=>{ const s=sectionOf(t)||''; return s==='backlog'?'':((TE_CATS.find(c=>c[0].toLowerCase()===s.toLowerCase())||[s])[0]); },
  catRaw:t=>({sec:A(t.id).section,sr:t.sectionRemote||'',m:t.slotRemote||'',ty:t.typeRemote||''}),
  setCat:(t,v)=>{ if(!v){ const f={Section:'backlog',MeetingSlot:''}; if(t.typeRemote==='call'){ f.Type=null; t.typeRemote=''; } A(t.id).section='backlog'; t.sectionRemote='backlog'; t.slotRemote=''; saveAug(); patchTask(t.id,f); refresh(); return; }
    if(v==='calls'){ A(t.id).section='calls'; t.sectionRemote='calls'; t.slotRemote=''; t.typeRemote='call'; saveAug(); patchTask(t.id,{Section:'calls',MeetingSlot:'',Type:'call'}); refresh(); return; }
    moveSection(t.id,(v==='morning'||v==='afternoon')?v:v); if(!(v==='morning'||v==='afternoon')&&v!==v.toLowerCase()) patchTask(t.id,{Section:v,MeetingSlot:''}); },
  restoreCat:(t,p)=>{ A(t.id).section=p.sec; t.sectionRemote=p.sr; t.slotRemote=p.m; t.typeRemote=p.ty; saveAug(); patchTask(t.id,Object.assign({Section:p.sr,MeetingSlot:p.m},p.ty==='call'?{Type:'call'}:{})); refresh(); },
  done:t=>markDone(t.id), snooze:(t,d,date)=>{ const ds=date?new Date(date+'T08:00:00'):new Date(Date.now()+d*864e5); A(t.id).snoozeUntil=ds.getTime(); saveAug(); const v=isoOf(ds); t.doDate=v; patchTask(t.id,{DoDate:v}); toast('Snoozed to '+v); refresh(); } };
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='z'&&window._teUndo&&!/INPUT|TEXTAREA/.test((document.activeElement||{}).tagName||'')){ e.preventDefault(); const f=window._teUndo; window._teUndo=null; f(); toast('Undone'); } });
if(window.TaskEditor) TaskEditor.plain('.cap,.poph,.ph,.ovh,.pslcb,.slotcard .sh,.mloc');
function openTask(id){ const t=tasks.find(x=>x.id===id); if(!t){ toast('Task not found'); return; } if(window.TaskEditor){ closeOv(); TaskEditor.open(t); return; }
  const cur=sectionOf(t);
  ovh.innerHTML=`◎ Edit Task<button class="x" data-x>✕</button>`;
  ovbody.innerHTML=`<div class="ed">
    ${t.project?`<span class="proj">${esc(t.project)}</span><br>`:''}
    <textarea class="name" id="edName" rows="2">${esc(cleanName(t))}</textarea>
    <div class="meta">${esc([t.lead&&('Lead: '+t.lead),t.sub&&('Sub: '+t.sub),daysOpen(t)+' days open'].filter(Boolean).join('  ·  '))}</div>
    <div class="lbl">Move to</div>
    <div class="secchips" id="edSecs">${SECTIONS.map(([k,l])=>`<button class="secchip${k===cur?' on':''}" data-sec="${k}">${esc(l)}</button>`).join('')}</div>
    <div class="edact">
      <button class="done" data-act="done"><span class="ei">✓</span>Done</button>
      <button data-act="snooze"><span class="ei">😴</span>Snooze</button>
      <button data-act="focus"><span class="ei">◎</span>Focus</button>
      <button class="del" data-act="del"><span class="ei">🗑</span>Delete</button>
    </div>
    ${t.phone?`<a class="edlink" href="tel:${esc(t.phone.replace(/[^\\d+]/g,''))}">📞 Call ${esc(t.phone)}</a>`:''}
  </div>`;
  ov.classList.add('show'); const nm=$('#edName'); nm.focus(); nm.setSelectionRange(nm.value.length,nm.value.length);
  ovh.querySelector('[data-x]').onclick=closeOv;
  nm.onblur=()=>{ const v=nm.value.trim(); if(v&&v!==cleanName(t)){ t.name=v; patchTask(t.id,{Task:v}); toast('Saved'); refresh(); } };
  $('#edSecs').querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>{ moveSection(t.id,b.dataset.sec); $('#edSecs').querySelectorAll('[data-sec]').forEach(x=>x.classList.toggle('on',x===b)); });
  ovbody.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{ const a=b.dataset.act;
    if(a==='done'){ markDone(t.id); closeOv(); }
    else if(a==='snooze'){ A(t.id).snoozeUntil=Date.now()+24*3600000; saveAug(); toast('Snoozed 1 day'); closeOv(); refresh(); }
    else if(a==='focus'){ moveSection(t.id,'focus'); toast('Moved to Focus'); }
    else if(a==='del'){ if(confirm('Delete this task permanently?')){ delTask(t.id); closeOv(); } }
  });
}
function openList(key){ const em=CAT[key][0], cap=CAT[key][1]; const items=itemsFor(key);
  ovh.innerHTML=`${em} ${esc(cap)} · ${items.length}<button class="x" data-x>✕</button>`;
  if(key==='meeting'){ ovbody.innerHTML='<div class="plist">'+(items.length?items.map(e=>`<div class="lrow"><span class="dot" style="background:${projColor(e.when)}"></span><span class="lt"><span class="ln">${esc(e.name)}</span><span class="lm">${esc(e.when||'')}</span></span>${e.link?`<a class="edlink" style="margin:0;padding:6px 10px" href="${esc(e.link)}" target="_blank" rel="noopener">${e.link.indexOf('tel:')===0?'📞':'▶ Join'}</a>`:''}</div>`).join(''):'<div class="none">Nothing here.</div>')+'</div>';
    ov.classList.add('show'); ovh.querySelector('[data-x]').onclick=closeOv; return; }
  if(key==='respond'){ ovbody.innerHTML='<div class="plist">'+(items.length?items.map(e=>`<div class="lrow">${e.link?`<a href="${esc(e.link)}" target="_blank" rel="noopener" style="text-decoration:none;color:inherit;display:flex;gap:11px;align-items:center;flex:1;min-width:0">`:'<span style="display:flex;gap:11px;align-items:center;flex:1;min-width:0">'}<span class="dot" style="background:${projColor(e.project)}"></span><span class="lt"><span class="ln">${esc(e.name)}</span><span class="lm">${esc(e.project||'')}</span></span>${e.link?'</a>':'</span>'}</div>`).join(''):'<div class="none">No replies to review.</div>')+'</div>';
    ov.classList.add('show'); ovh.querySelector('[data-x]').onclick=closeOv; return; }
  ovbody.innerHTML='<div class="phint">Drag ⋮⋮ to reorder · tap to edit · ⊘ remove from category · ✓ finish</div>'+
    '<div class="plist" id="plist">'+capRows(items,150)+'</div>';
  ov.classList.add('show'); ovh.querySelector('[data-x]').onclick=closeOv;
  wireRowEls($('#plist'), key);
}
function enableDrag(pl,key){ let dragEl=null;
  pl.querySelectorAll('.lrow[draggable]').forEach(r=>{
    r.addEventListener('dragstart',()=>{ dragEl=r; r.classList.add('drag'); });
    r.addEventListener('dragend',()=>{ r.classList.remove('drag'); pl.querySelectorAll('.over').forEach(x=>x.classList.remove('over')); persistOrder(pl,key); });
    r.addEventListener('dragover',e=>{ e.preventDefault(); const a=dragEl; if(!a||a===r)return;
      const rect=r.getBoundingClientRect(); const after=(e.clientY-rect.top)/rect.height>0.5;
      pl.querySelectorAll('.over').forEach(x=>x.classList.remove('over')); r.classList.add('over');
      pl.insertBefore(a, after?r.nextSibling:r); });
  });
}
function persistOrder(pl,key){ const ids=[...pl.querySelectorAll('.lrow[data-id]')].map(r=>r.dataset.id); order[key]=ids; saveOrder(); clearIF(); renderCorners(); refreshBubs(); }

/* ====== writes ====== */
async function patchTask(id,fields){ if(demo||!cfg.apiKey||String(id).startsWith('d')) return true;
  try{ const r=await fetch(atUrl()+'/'+id,{method:'PATCH',headers:{Authorization:'Bearer '+cfg.apiKey,'Content-Type':'application/json'},body:JSON.stringify({fields,typecast:true})});
    if(!r.ok){ toast('Save failed '+r.status); return false; } return true; }catch(e){ toast('Offline — not saved'); return false; } }
function moveSection(id,sec){ const t=tasks.find(x=>x.id===id); if(!t)return;
  if(sec==='morning'||sec==='afternoon'){ delete A(id).section; t.slotRemote=sec; t.sectionRemote=''; saveAug(); patchTask(id,{MeetingSlot:sec,Section:''}); }
  else { A(id).section=sec; t.sectionRemote=sec; t.slotRemote=''; saveAug(); patchTask(id,{Section:sec,MeetingSlot:''}); }
  refresh(); }
function markDone(id){ const t=tasks.find(x=>x.id===id); if(!t)return; t.status='Done'; patchTask(id,{Status:'Done'});
  tasks=tasks.filter(x=>x.id!==id); toast('✓ Done'); refresh(); }
async function delTask(id){ tasks=tasks.filter(x=>x.id!==id); refresh();
  if(demo||!cfg.apiKey||String(id).startsWith('d')) return;
  try{ await fetch(atUrl()+'/'+id,{method:'DELETE',headers:{Authorization:'Bearer '+cfg.apiKey}}); toast('Deleted'); }catch(e){} }
async function createTask(section,text){ const slot=(section==='morning'||section==='afternoon');
  const t={id:'d'+Date.now(),createdTime:new Date().toISOString(),name:text,project:'',lead:'',sub:'',status:'Open',slotRemote:slot?section:'',sectionRemote:slot?'':section,priorityRemote:0,typeRemote:'',phone:''};
  tasks.unshift(t); if(!slot) A(t.id).section=section; saveAug(); refresh(); toast('Added');
  setTimeout(()=>{ const n=$('#incAdd'); if(n&&section==='incoming') n.focus(); },0);
  if(demo||!cfg.apiKey) return;
  const fields=slot?{Task:text,Status:'Open',MeetingSlot:section}:{Task:text,Status:'Open',Section:section};
  try{ const r=await fetch(atUrl(),{method:'POST',headers:{Authorization:'Bearer '+cfg.apiKey,'Content-Type':'application/json'},body:JSON.stringify({fields,typecast:true})});
    if(r.ok){ const d=await r.json(); const old=t.id; t.id=d.id; t.createdTime=d.createdTime; if(aug[old]){ aug[d.id]=aug[old]; delete aug[old]; saveAug(); } refresh(); } else toast('Add failed '+r.status); }catch(e){ toast('Offline — not saved'); } }

function refreshBubs(){ renderCore(); bubEls.forEach(renderBub); updateLinks(); }
function refresh(){ clearIF(); refreshBubs(); renderCorners(); updateHud(); }
function render(){ layout(); if(!cycled){cycled=true;startCycles();} }
/* ---- live HUD readout: greeting + open/urgent counts + next meeting ---- */
function updateHud(){
  const h=new Date().getHours(); const g=$('#greet'); if(g) g.textContent=(h<12?'GOOD MORNING':h<17?'GOOD AFTERNOON':'GOOD EVENING')+' ◎';
  const s=$('#status'); if(!s)return;
  if(!tasks.length && !calendar.length){ return; }
  const open=tasks.filter(live).length;
  let urg=0; ['priority','calls','nextup','bigticket','sunday','backlog','still','morning','afternoon','incoming'].forEach(k=>{ if(hasStale(itemsFor(k))) urg++; });
  const nn=nowNext(todayISO()); const nxt=nn.now||nn.next;
  const nstr=nxt?((nn.now?'NOW ':'NEXT ')+(nxt.when||'').replace(/\s*[–—].*/,'')+' · '+String(nxt.title||'').replace(/\s+/g,' ').slice(0,18)):'NO MEETINGS LEFT';
  const bits=[open+' OPEN']; if(urg) bits.push(urg+' NEED ATTENTION'); bits.push(nstr);
  s.innerHTML=bits.map((b,i)=>i===bits.length-1&&nn.now?'<span style="color:#bdefff">'+esc(b)+'</span>':esc(b)).join('  ·  ');
}
/* ---- ambient particle field (futuristic depth; pauses when hidden / reduced-motion) ---- */
const fx=$('#fx'); let fxc=fx?fx.getContext('2d'):null, parts=[], fxRun=false;
const reduceMotion=()=>{ try{ return matchMedia('(prefers-reduced-motion:reduce)').matches; }catch(e){ return false; } };
function fxResize(){ if(!fxc)return; const dpr=Math.min(1.5,devicePixelRatio||1); fx.width=innerWidth*dpr; fx.height=innerHeight*dpr; fxc.setTransform(dpr,0,0,dpr,0,0);
  const N=Math.max(20,Math.min(42,Math.round(innerWidth*innerHeight/44000))); parts=[];
  for(let i=0;i<N;i++) parts.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.5+.4,vx:(Math.random()-.5)*.14,vy:(Math.random()-.5)*.14,a:Math.random()*.35+.08,tw:Math.random()*6.28}); fxDraw(); }
function fxDraw(){ if(!fxc)return; fxc.clearRect(0,0,innerWidth,innerHeight);
  for(const p of parts){ const a=p.a*(0.6+0.4*Math.sin(p.tw)); fxc.beginPath(); fxc.arc(p.x,p.y,p.r,0,6.2832); fxc.fillStyle='rgba(120,220,240,'+a.toFixed(3)+')'; fxc.fill(); } }
function fxTick(){ if(!fxRun||!fxc){return;}
  for(const p of parts){ p.x+=p.vx; p.y+=p.vy; p.tw+=.02;
    if(p.x<-2)p.x=innerWidth+2; if(p.x>innerWidth+2)p.x=-2; if(p.y<-2)p.y=innerHeight+2; if(p.y>innerHeight+2)p.y=-2; }
  fxDraw(); requestAnimationFrame(fxTick); }
function fxStart(){ if(!fxc)return; fxResize();   // always draws a static field (depth even under reduced-motion)
  if(!reduceMotion() && !fxRun){ fxRun=true; requestAnimationFrame(fxTick); } }
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ fxRun=false; } else if(fxc&&!reduceMotion()){ if(!fxRun){ fxRun=true; requestAnimationFrame(fxTick); } } });

/* ====== boot ====== */
function tick(){ $('#clock').textContent=new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); updateHud(); }
function boot(){ tick(); setInterval(tick,20000); fxStart();
  if(!cfg.apiKey){ $('#setup').style.display='flex'; }
  fetchAll();
  setInterval(()=>fetchAll(),5*60000);
}
addEventListener('resize',()=>{ popPinned=false; popHide(true); fxResize(); clearTimeout(window._rz); window._rz=setTimeout(layout,150); });
$('#keygo').onclick=()=>{ const k=$('#keyin').value.trim(); if(!k)return; cfg.apiKey=k; try{const c=JSON.parse(localStorage.getItem('tb.cfg')||'{}');c.apiKey=k;localStorage.setItem('tb.cfg',JSON.stringify(c));}catch(e){} $('#setup').style.display='none'; demo=false; fetchAll(); };
$('#demo').onclick=()=>{ $('#setup').style.display='none'; demo=true; demoData(); render(); };
$('#reset').onclick=resetLayout;
$('#cmdBtn').onclick=openCmd;
function updHome(){ const b=$('#homeToggle'); const isFocus=localStorage.getItem('tb.landing')!=='grid'; b.textContent=isFocus?'★ HOME: FOCUS':'☆ HOME: GRID'; b.style.color=isFocus?'var(--cyan)':'var(--dim)'; b.style.borderColor=isFocus?'rgba(57,199,223,.5)':'var(--line)'; }
$('#homeToggle').onclick=()=>{ if(localStorage.getItem('tb.landing')!=='grid')localStorage.setItem('tb.landing','grid'); else localStorage.removeItem('tb.landing'); updHome(); };
updHome();
boot();
