<style>

.amb .n{display:flex;justify-content:space-between;align-items:center}.amb .n button{width:24px;height:22px;border:0;border-radius:6px;background:rgba(0,0,0,.14);color:inherit;font-weight:800;cursor:pointer}
.ivbtn{grid-column:1/-1;height:32px;border-radius:10px;border:1px solid var(--line);background:rgba(57,199,223,.07);color:var(--ink);font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}.ivbtn:hover{border-color:var(--cyan);color:var(--cyan)}.ivbtn b{color:var(--cyan)}

.cxpane{padding:8px!important}.cxb{max-height:min(190px,23vh);overflow:auto;margin-top:5px}

function applyOrder(key,list){ const o=order[key]; if(!o||!o.length) return list; const pos={}; o.forEach((id,i)=>pos[id]=i); return list.slice().sort((a,b)=>((pos[a.id]==null?1e9:pos[a.id])-(pos[b.id]==null?1e9:pos[b.id]))); }

  else { const f=RING_F[ringMode], cnt={}; tasks.filter(live).forEach(t=>splitV(t[f]).forEach(g=>{ cnt[g]=(cnt[g]||0)+1; })); L=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([g,n])=>[ringMode.toLowerCase()+':'+g,n]); }
  const pos=k=>{ const i=p.ord.indexOf(k); return i<0?1e6:i; }; return L.map((x,i)=>[x[0],x[1],i]).sort((a,b)=>(pos(a[0])-pos(b[0]))||(a[2]-b[2])).map(x=>[x[0],x[1]]); }
function ringKeys(){ const A=ringAll().map(x=>x[0]), sel=ringPref().sel; let pool=A.filter(k=>sel.includes(k)); if(!pool.length) pool=ringMode==='C'?ORBIT:A;
  const pages=Math.max(1,Math.ceil(pool.length/8)); ringPage%=pages; return pool.slice(ringPage*8,ringPage*8+8); }
let ringPage=0; setInterval(()=>{ if(document.hidden||document.querySelector('#bubbles .bub:hover')) return; ringPage++; clearIF(); renderBubbles(); layout(); },180000);
const capOf=k=>{ const m=/^([pls]):(.*)$/.exec(k); if(m) return [{p:'▣',l:'◍',s:'◆'}[m[1]],m[2]]; return CAT[k]||['•',k]; };
function byLeadProj(a,b){ const la=(a.lead||'').toLowerCase(), lb=(b.lead||'').toLowerCase(); if(!!la!==!!lb) return la?-1:1; if(la!==lb) return la<lb?-1:1;
  const pa=(a.project||'').toLowerCase(), pb=(b.project||'').toLowerCase(); if(!!pa!==!!pb) return pa?-1:1; if(pa!==pb) return pa<pb?-1:1; return daysOpen(a)-daysOpen(b); }

  { const m=/^([pls]):(.*)$/.exec(key); if(m){ const f=RING_F[m[1].toUpperCase()]; return applyOrder(key,tasks.filter(t=>live(t)&&splitV(t[f]).includes(m[2])).sort((a,b)=>score(b)-score(a))); } }
  switch(key){

  h.onpointermove=e=>{ if(!drag) return; let L=ol+(e.clientX-sx), T=ot+(e.clientY-sy); L=Math.max(6,Math.min(L,innerWidth-60)); T=Math.max(6,Math.min(T,innerHeight-40)); box.style.left=L+'px'; box.style.top=T+'px'; };
  h.onpointerup=()=>{ if(!drag) return; drag=false; try{ localStorage.setItem('tb.fbox',JSON.stringify({l:parseInt(box.style.left),t:parseInt(box.style.top)})); }catch(_){} }; }
addEventListener('resize',()=>{ if(!$('#filesBox').hidden) placeFbox(); });
/* ▦ P·S·L·C filter bar — all Project / Sub / Lead / Category values as outlined clickable chips (like the dashboard) */
function catName(sec){ const c=CAT[sec]; return c?c[1]:(sec||'—'); }
function fltTally(fn){ const m={}; tasks.filter(t=>live(t)).forEach(t=>{ const v=fn(t); if(v) m[v]=(m[v]||0)+1; }); return Object.entries(m).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])); }
function openFilters(){
  const rows=[['PROJECT','project',fltTally(t=>t.project)],['SUB','sub',fltTally(t=>t.sub)],['LEAD','lead',fltTally(t=>t.lead)],['CATEGORY','category',fltTally(t=>catName(sectionOf(t)))]];
  ovh.innerHTML='▦ Filter · Project · Sub · Lead · Category<button class="x" data-x>✕</button>';
  ovb.innerHTML=rows.map(([lab,field,ents])=>'<div class="fltrow"><span class="fltlab">'+lab+'</span><div class="fltchips">'+(ents.length?ents.map(([v,n])=>'<button class="fltchip" data-ff="'+esc(field)+'" data-fv="'+esc(v)+'">'+esc(v)+' <i>'+n+'</i></button>').join(''):'<span class="none">—</span>')+'</div></div>').join('');
  ov.classList.add('show'); ovh.querySelector('[data-x]').onclick=closeOv;
  ovb.querySelectorAll('[data-ff]').forEach(b=>b.onclick=()=>openFiltered(b.dataset.ff,b.dataset.fv));
}
function openFiltered(field,value){
  const match=t=>field==='project'?(t.project||'')===value:field==='sub'?(t.sub||'')===value:field==='lead'?(t.lead||'')===value:field==='category'?catName(sectionOf(t))===value:false;
  const items=tasks.filter(t=>live(t)&&match(t)).sort(byLeadProj);
  ovh.innerHTML='▦ '+esc(value)+' · '+items.length+'<button class="x" data-x>✕</button>';
  ovb.innerHTML='<div class="phint"><button class="pill" data-back>‹ All filters</button> · tap a task to edit</div><div class="plist" id="plist">'+groupRows(items,200)+'</div>';
  ov.classList.add('show'); ovh.querySelector('[data-x]').onclick=closeOv; wireRows($('#plist'),null);
  const bk=ovb.querySelector('[data-back]'); if(bk) bk.onclick=openFilters;
}
function openCQList(){ const L=CQ.list(); ovh.innerHTML='✨ Claude requests · '+L.length+'<button class="x" data-x>✕</button>';
  ovb.innerHTML='<div class="phint">'+CQ.summary()+'</div>'+(L.length?L.map(q=>CQ.rowHTML(q)).join(''):'<div class="none">No requests this week.</div>');
  ov.classList.add('show'); ovh.querySelector('[data-x]').onclick=closeOv; CQ.wire(ovb,{toast,onOpen:cqOpenTask}); }
if(window.CQ){ CQ.init({key:()=>cfg.apiKey,base:()=>cfg.baseId}); CQ.onChange(()=>{ renderCQPane(); if(ov.classList.contains('show')&&/Claude requests/.test(ovh.textContent)&&!(document.activeElement&&ovb.contains(document.activeElement))) openCQList(); }); }
/* ===== open-items guide drawer (guide.js) ===== */
const gItem=t=>({id:t.id,name:cleanName(t),project:t.project,createdTime:t.createdTime,doDate:t.doDate,guide:t.guide,next:t.next,guideStep:t.guideStep});
function openGuide(id){ const t=tasks.find(x=>x.id===id); if(!t||!window.Guide){ toast('Item not found'); return; }
  Guide.open(gItem(t),{
    key:()=>cfg.apiKey, base:()=>cfg.baseId,
    saveStep:(x,k)=>{ t.guideStep=k; patchTask(t.id,{GuideStep:k}); },
    next:()=>{ const n=Guide.list(tasks).find(x=>x.id!==t.id); return n?Object.assign(gItem(n),{_open:()=>openGuide(n.id)}):null; },
    done:()=>markDone(t.id),
    drop:()=>{ t.status='Disposed'; patchTask(t.id,{Status:'Disposed'}); tasks=tasks.filter(x=>x.id!==t.id); toast('Dropped (Disposed)'); renderAll(); },
    snooze:(x,d)=>{ t.doDate=d; patchTask(t.id,{DoDate:d}); toast('Snoozed to '+dnLabel(d)); renderAll(); },
    edit:()=>openTask(t.id) }); }
/* ===== writes ===== */
async function patchTask(id,fields){ if(demo||!cfg.apiKey||String(id).startsWith('d')) return true;
  try{ const r=await fetch(atUrl()+'/'+id,{method:'PATCH',headers:{Authorization:'Bearer '+cfg.apiKey,'Content-Type':'application/json'},body:JSON.stringify({fields,typecast:true})}); if(!r.ok){ toast('Save failed '+r.status); return false; } return true; }catch(e){ toast('Offline'); return false; } }
function moveSection(id,sec){ const t=tasks.find(x=>x.id===id); if(!t)return;
  if(sec==='morning'||sec==='afternoon'){ delete A(id).section; t.slotRemote=sec; t.sectionRemote=''; saveAug(); patchTask(id,{MeetingSlot:sec,Section:''}); }
  else{ A(id).section=sec; t.sectionRemote=sec; t.slotRemote=''; saveAug(); patchTask(id,{Section:sec,MeetingSlot:''}); } renderAll(); }
function markDone(id){ const t=tasks.find(x=>x.id===id); if(!t)return; t.status='Done'; patchTask(id,{Status:'Done'}); tasks=tasks.filter(x=>x.id!==id); toast('✓ Done'); renderAll(); }
function removeFromCat(id){ const t=tasks.find(x=>x.id===id); if(!t)return; delete A(id).section; t.sectionRemote=''; t.slotRemote=''; saveAug(); patchTask(id,{Section:'',MeetingSlot:''}); toast('Removed from category'); renderAll(); }
async function delTask(id){ const t=tasks.find(x=>x.id===id); if(!t) return; t.status='Disposed'; tasks=tasks.filter(x=>x.id!==id); renderAll(); patchTask(id,{Status:'Disposed'}); toastU('⊘ Disposed',()=>{ t.status='Open'; tasks.unshift(t); patchTask(id,{Status:'Open'}); renderAll(); }); }
async function createTask(section,text){ const slot=(section==='morning'||section==='afternoon');
  const t={id:'d'+Date.now(),createdTime:new Date().toISOString(),name:text,project:'',lead:'',sub:'',status:'Open',slotRemote:slot?section:'',sectionRemote:slot?'':section,priorityRemote:0,typeRemote:'',phone:''};
  tasks.unshift(t); if(!slot) A(t.id).section=section; saveAug(); renderAll(); toast('Added'); setTimeout(()=>{ const n=$('#incAdd'); if(n&&section==='incoming')n.focus(); },0);
  if(demo||!cfg.apiKey)return; const fields=slot?{Task:text,Status:'Open',MeetingSlot:section}:{Task:text,Status:'Open',Section:section};
  try{ const r=await fetch(atUrl(),{method:'POST',headers:{Authorization:'Bearer '+cfg.apiKey,'Content-Type':'application/json'},body:JSON.stringify({fields,typecast:true})}); if(r.ok){ const d=await r.json(); const old=t.id; t.id=d.id; t.createdTime=d.createdTime; if(aug[old]){ aug[d.id]=aug[old]; delete aug[old]; saveAug(); } renderAll(); } else toast('Add failed '+r.status); }catch(e){ toast('Offline'); } }

/* ===== command bar ===== */
const cmd=$('#cmd'), cmdInp=$('#cmdInp'), cmdRes=$('#cmdRes'); let cmdItems=[], cmdSel=0;
function openCmd(){ cmd.classList.add('show'); cmdInp.value=''; buildCmd(''); setTimeout(()=>cmdInp.focus(),0); }
function closeCmd(){ cmd.classList.remove('show'); }
cmd.addEventListener('click',e=>{ if(e.target===cmd) closeCmd(); });
function buildCmd(q){ q=(q||'').trim(); const ql=q.toLowerCase(); cmdItems=[]; cmdSel=0;
  if(q) cmdItems.push({t:'Add “'+q+'”',d:'→ Incoming',k:'add',run:()=>{ createTask('incoming',q); closeCmd(); }});
  if(!ql||'focus now'.includes(ql)) cmdItems.push({t:'◎ Now / Focus',d:itemsFor('focus').length+' items',k:'go',run:()=>{ closeCmd(); openList('focus'); }});
  Object.keys(CAT).filter(k=>k!=='focus').forEach(k=>{ const cap=CAT[k][1]; if(!ql||cap.toLowerCase().includes(ql)){ const n=itemsFor(k).length; cmdItems.push({t:CAT[k][0]+' '+cap,d:n+' item'+(n===1?'':'s'),k:'go',run:()=>{ closeCmd(); openList(k); }}); } });
  if(ql){ if('am pm calls focus 2 focus2'.includes(ql)) cmdItems.push({t:'◉ AM · PM Calls (Focus 2)',d:'open sender',k:'go',run:()=>{ closeCmd(); location.href='focus2.html'; }});
    tasks.filter(t=>live(t)&&[t.name,t.project,t.lead,t.nextUp,t.sub].map(v=>(v||'').toLowerCase()).some(v=>v.includes(ql))).slice(0,12).forEach(t=>cmdItems.push({t:cleanName(t),d:[t.project,t.lead].filter(Boolean).join(' · '),k:'task',run:()=>{ closeCmd(); openTask(t.id); }})); }
  paintCmd(); }
function paintCmd(){ cmdRes.innerHTML=cmdItems.map((it,i)=>{ const kk=it.k==='add'?'<span class="k">add</span>':it.k==='go'?'<span class="k g">go</span>':'<span class="k g">task</span>'; return '<div class="cmdrow'+(i===cmdSel?' sel':'')+'" data-i="'+i+'">'+kk+'<span class="t">'+esc(it.t)+'</span>'+(it.d?'<span class="d">'+esc(it.d)+'</span>':'')+'</div>'; }).join('')||'<div class="cmdrow"><span class="t" style="color:var(--dim)">Type to search or add…</span></div>';
  cmdRes.querySelectorAll('.cmdrow[data-i]').forEach(r=>{ r.onclick=()=>{ const it=cmdItems[+r.dataset.i]; if(it&&it.run)it.run(); }; r.onmousemove=()=>{ if(cmdSel!==+r.dataset.i){ cmdSel=+r.dataset.i; markCmd(); } }; }); }
function markCmd(){ cmdRes.querySelectorAll('.cmdrow').forEach((r,i)=>r.classList.toggle('sel',i===cmdSel)); }
cmdInp.addEventListener('input',()=>buildCmd(cmdInp.value));
cmdInp.addEventListener('keydown',e=>{ if(e.key==='ArrowDown'){e.preventDefault();cmdSel=Math.min(cmdItems.length-1,cmdSel+1);markCmd();}else if(e.key==='ArrowUp'){e.preventDefault();cmdSel=Math.max(0,cmdSel-1);markCmd();}else if(e.key==='Enter'){e.preventDefault();const it=cmdItems[cmdSel];if(it&&it.run)it.run();}else if(e.key==='Escape'){e.preventDefault();closeCmd();} });
addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){ e.preventDefault(); cmd.classList.contains('show')?closeCmd():openCmd(); } else if(e.key==='/'&&!cmd.classList.contains('show')&&!/^(input|textarea)$/i.test((e.target&&e.target.tagName)||'')&&!(e.target&&e.target.isContentEditable)){ e.preventDefault(); focusCx(); } });
{ const b=$('#cxBtn'); if(b) b.onclick=focusCx; }

/* ===== boot ===== */
function tick(){ $('#clk').textContent=new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}); }
function updHome(){ const b=$('#homeToggle'); const isFocus=localStorage.getItem('tb.landing')!=='grid'; b.textContent=isFocus?'★ HOME: FOCUS':'☆ HOME: GRID'; b.style.color=isFocus?'var(--cyan)':'var(--dim)'; b.style.borderColor=isFocus?'rgba(57,199,223,.5)':'var(--line)'; }
$('#cmdBtn').onclick=openCmd; $('#cmdBtn2').onclick=openCmd;
$('#homeToggle').onclick=()=>{ if(localStorage.getItem('tb.landing')!=='grid')localStorage.setItem('tb.landing','grid'); else localStorage.removeItem('tb.landing'); updHome(); };
$('#keygo').onclick=()=>{ const k=$('#keyin').value.trim(); if(!k)return; cfg.apiKey=k; try{const c=JSON.parse(localStorage.getItem('tb.cfg')||'{}');c.apiKey=k;localStorage.setItem('tb.cfg',JSON.stringify(c));}catch(e){} $('#setup').style.display='none'; demo=false; fetchAll(); };
$('#demo').onclick=()=>{ $('#setup').style.display='none'; demo=true; demoData(); renderAll(); };
function boot(){ tick(); setInterval(tick,30000); updHome(); if(!cfg.apiKey) $('#setup').style.display='flex'; fetchAll(); setInterval(()=>{ if(!document.hidden) fetchAll(); },60000);
  let lastF=0; const fresh=()=>{ if(document.hidden||Date.now()-lastF<8000) return; lastF=Date.now(); fetchAll(); }; document.addEventListener('visibilitychange',fresh); window.addEventListener('focus',fresh); }
boot();
</script></body></html>
