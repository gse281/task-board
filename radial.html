<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Focus</title>

<style>
:root{ --bg:#070d11; --ink:#eaf6fb; --cyan:#39c7df; --dim:#7f9aa3; --gold:#6fd0e0; --green:#3a8f5f; --orange:#e8683c;
  --line:rgba(57,199,223,.18); --card:#0d1a21; --card2:#102029; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:rgba(57,199,223,.18);border-radius:6px}
html,body{margin:0;height:100%;background:radial-gradient(130% 120% at 50% 42%,#0b141a 0%,#070d11 62%,#04070a 100%);color:var(--ink);font:15px/1.4 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
textarea,input{font:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
#stage{position:fixed;inset:0;overflow:hidden}
/* top bar */
.top{position:absolute;top:0;left:0;right:0;z-index:15;display:flex;align-items:center;gap:14px;padding:12px 18px;pointer-events:none}
.top>*{pointer-events:auto}
.top .greet{font:700 12px ui-monospace,Menlo,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--cyan);white-space:nowrap}
.top .sum{flex:1;min-width:0;text-align:center;font:600 12px ui-monospace,Menlo,monospace;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sum b{color:var(--cyan)} .top .sum .att{color:#8fe4f4;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.top .sum .att:hover{color:#cdf3ff}
.top .cmdbtn{flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 13px;font:700 11px ui-monospace,Menlo,monospace;letter-spacing:1px;color:var(--dim)}
.top .cmdbtn:hover{color:var(--cyan);border-color:var(--cyan)}
.top .clk{flex:none;font-size:15px;color:var(--ink);min-width:66px;text-align:right}
@media(max-width:720px){ .top .sum{display:none} }
/* rings (static CSS circles) */
.ring{position:absolute;border-radius:50%;border:1px solid rgba(57,199,223,.1);pointer-events:none;z-index:1}
.ring.r2{border-style:dashed;border-color:rgba(57,199,223,.07)}
/* core */
.core{position:absolute;z-index:6;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;cursor:pointer;
  background:radial-gradient(circle at 50% 42%,rgba(57,199,223,.15),rgba(9,16,20,.2) 72%);border:1.5px solid rgba(57,199,223,.55);box-shadow:0 0 30px rgba(57,199,223,.14)}
.core:hover{border-color:var(--cyan)}
.core .cl{font:700 11px ui-monospace,Menlo,monospace;letter-spacing:4px;text-transform:uppercase;color:var(--cyan)}
.core .cc{font:800 11px ui-monospace,Menlo,monospace;color:var(--dim);margin-top:2px}
.core .proj{display:inline-block;font:800 11px ui-monospace,Menlo,monospace;color:#07141a;background:var(--cyan);border-radius:6px;padding:1px 8px;margin:12px 0 7px}
.core .cit{font-weight:700;font-size:21px;line-height:1.25;max-width:92%}
.core .cempty{color:var(--dim);font-size:14px;margin-top:12px;max-width:85%}
/* bubbles */
.bub{position:absolute;z-index:5;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;cursor:pointer;overflow:hidden;
  background:var(--card);border:1px solid rgba(57,199,223,.3);box-shadow:0 6px 18px rgba(0,0,0,.45);transition:transform .15s,border-color .15s}
.bub:hover{transform:scale(1.06);border-color:var(--cyan);z-index:7}
.bub .bcap{font:700 10px ui-monospace,Menlo,monospace;letter-spacing:1px;text-transform:uppercase;color:var(--cyan);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bub .bn{font:800 11px ui-monospace,Menlo,monospace;color:var(--dim);margin-top:1px}
.bub .bit{margin-top:7px;font-weight:600;font-size:12px;line-height:1.22;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;max-width:100%}
.bub .bit .pr{display:inline-block;font:800 9px ui-monospace,Menlo,monospace;color:#07141a;background:var(--gold);border-radius:4px;padding:0 5px;margin-bottom:4px}
.bub .bit.e{color:var(--dim)}
.bub.urgent{border-color:rgba(57,199,223,.6)} .bub.urgent .bcap{color:#bdefff}
.bub.empty{opacity:.4} .bub.empty:hover{opacity:.85}
/* corners */
.corner{position:absolute;z-index:8;width:min(290px,30vw);display:flex;flex-direction:column;gap:10px}
.tl{top:50px;left:14px}.ml{left:14px;top:50%}
#cML .pane{display:flex;flex-direction:column;max-height:100%;min-height:0}#cML .oil{overflow-y:auto;overflow-x:hidden;min-height:0;margin:0 -4px}#cML .lt{overflow:hidden}#cML .ln{display:block}#cML .ld{white-space:nowrap}#cML .ld .tm{color:var(--cyan);margin-right:5px;font-weight:600}#cML .lrow .dot.o{background:var(--orange)!important}#cML .oisub{color:var(--dim);font:600 10.5px ui-monospace,Menlo,monospace;margin:-3px 0 5px}.tr{top:50px;right:14px}.bl{bottom:58px;left:14px}.br{bottom:58px;right:14px}

.pane{background:rgba(10,20,26,.94);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pane.urgent{border-color:rgba(57,199,223,.5)}
.ph{display:flex;align-items:center;gap:7px;font:700 10.5px ui-monospace,Menlo,monospace;letter-spacing:1.3px;text-transform:uppercase;color:var(--cyan);margin-bottom:7px;cursor:pointer}
.ph .pn{margin-left:auto;color:var(--dim)} .ph:hover{color:#8fe4f4}
.subrow{display:flex;gap:10px}.subrow>div{flex:1;min-width:0}

.lrow .lm{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .ld{font:700 11px ui-monospace,Menlo,monospace;color:var(--dim);flex:none}
.lrow .ld.o{color:var(--orange)}
.lrow .rmcat,.lrow .tick{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);color:var(--dim);flex:none;display:grid;place-items:center;font-size:13px}

.none{color:var(--dim);font-size:12px;padding:5px 4px}

.addrow input:focus{border-color:var(--cyan)} .addrow input::placeholder{color:var(--dim)}
.addrow button{flex:none;background:var(--cyan);color:#07141a;border-radius:9px;padding:0 12px;font-weight:800}
/* meeting */
.meet .mtime{font:800 14px ui-monospace,Menlo,monospace;color:var(--gold)}
.meet .mtitle{font-weight:700;font-size:13.5px;margin-top:2px}
.meet .mloc{color:var(--dim);font-size:11.5px;margin-top:3px}
.meet .mjoin{display:inline-flex;align-items:center;gap:5px;margin-top:8px;background:rgba(57,199,223,.14);color:var(--ink);border:1px solid var(--cyan);border-radius:9px;padding:5px 11px;font:700 12px ui-monospace,Menlo,monospace;text-decoration:none}

.nowtag{display:inline-block;font:800 9px ui-monospace,Menlo,monospace;letter-spacing:1px;background:var(--cyan);color:#07141a;border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:middle}
/* weather */
.wxstrip{display:flex;gap:4px}
.wxc{flex:1;text-align:center;border-radius:7px;padding:4px 1px;background:rgba(57,199,223,.05)}
.wxc.today{box-shadow:inset 0 0 0 1px var(--cyan)}.wxc.wet{background:rgba(57,199,223,.14)}
.wxc .wd{font:700 8.5px ui-monospace,Menlo,monospace;color:var(--dim)}.wxc .we{font-size:15px;line-height:1.15}

/* notes */
.notes textarea{width:100%;height:276px;resize:none;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.4;outline:none}
.notes textarea:focus{border-color:var(--cyan)}
.notes .nnav{margin-left:auto;display:flex;align-items:center;gap:3px}
.notes .nnav button{color:var(--cyan);padding:0 5px;font-size:14px}.notes .nnav button:disabled{opacity:.3}
.notes .nnav .nlbl{font:700 9.5px ui-monospace,Menlo,monospace;color:var(--ink);min-width:50px;text-align:center;text-transform:none;letter-spacing:0}
.notes .nnav .nlbl.past{color:var(--gold)}
.notes .nres{max-height:200px;overflow:auto;margin-top:6px}.notes .nhit{padding:6px 8px;border-radius:8px;font-size:12px;line-height:1.35;color:var(--ink2,var(--ink));cursor:pointer;border:1px solid transparent}.notes .nhit:hover{border-color:var(--line);background:var(--card2)}.notes .nhit b{color:var(--cyan);font:700 10px ui-monospace,Menlo,monospace;margin-right:4px}.notes .nhit mark{background:rgba(57,199,223,.25);color:var(--ink);border-radius:3px}
.notes .nfoot{margin-top:5px;font:600 10.5px ui-monospace,Menlo,monospace;color:var(--dim)}
/* overlays */
.back{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(3,7,10,.86);padding:20px}
.back.show{display:flex}
.card{width:min(580px,94vw);max-height:90vh;display:flex;flex-direction:column;background:var(--card);border:1px solid rgba(57,199,223,.4);border-radius:18px;overflow:hidden}
.cardh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font:700 12px ui-monospace,Menlo,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--cyan)}
.cardh .x{margin-left:auto;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);color:var(--dim);font-size:16px;display:grid;place-items:center}
.cardh .x:hover{color:var(--cyan);border-color:var(--cyan)}
.cardb{overflow:auto;padding:16px}
.ed .proj{display:inline-block;font:800 11px ui-monospace,Menlo,monospace;color:#07141a;background:var(--orange);border-radius:6px;padding:2px 9px;margin-bottom:12px}
.ed .name{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);font-size:22px;font-weight:700;line-height:1.3;padding:4px 2px 10px;resize:none;outline:none}
.ed .name:focus{border-color:var(--cyan)}
.ed .meta{color:var(--dim);font-size:12.5px;margin:12px 2px}
.ed .lbl{font:700 10px ui-monospace,Menlo,monospace;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin:14px 2px 7px}
.secchips{display:flex;flex-wrap:wrap;gap:7px}
.secchip{border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;color:var(--ink);background:rgba(57,199,223,.05)}
.secchip:hover{border-color:var(--cyan)} .secchip.on{background:var(--cyan);border-color:var(--cyan);color:#07141a}
.edact{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:20px}
.edact button{min-height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 11px ui-monospace,Menlo,monospace;background:rgba(57,199,223,.06);border:1px solid var(--line);color:var(--ink)}
.edact button .ei{font-size:20px}.edact button:hover{border-color:var(--cyan)}
.edact .done{background:var(--green);border-color:var(--green);color:#fff}
.edact .del:hover{border-color:var(--orange);color:var(--orange)}
.edlink{display:inline-flex;align-items:center;gap:6px;margin-top:16px;color:var(--cyan);text-decoration:none;font-weight:700;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.plist .lrow{border-bottom:1px solid var(--line);padding:11px 8px}.plist .lrow:last-child{border-bottom:0}
.plist .ln{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.phint{color:var(--dim);font:600 11px ui-monospace,Menlo,monospace;padding:0 2px 10px}
/* command bar */
#cmd{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;background:rgba(3,7,10,.8);padding:13vh 16px 20px}
#cmd.show{display:flex}
.cmdbox{width:min(620px,94vw);max-height:76vh;display:flex;flex-direction:column;background:var(--card);border:1px solid rgba(57,199,223,.45);border-radius:16px;overflow:hidden}
.cmdin{display:flex;align-items:center;gap:11px;padding:15px 17px;border-bottom:1px solid var(--line)}
.cmdin>span{color:var(--cyan);font:800 15px ui-monospace,Menlo,monospace}
.cmdin input{flex:1;background:transparent;border:0;outline:none;color:var(--ink);font-size:18px}
.cmdin input::placeholder{color:var(--dim)}
.cmdres{overflow:auto;padding:6px}
.cmdrow{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer}
.cmdrow.sel{background:rgba(57,199,223,.15)}
.cmdrow .k{font:800 9.5px ui-monospace,Menlo,monospace;letter-spacing:1px;color:#07141a;background:var(--cyan);border-radius:5px;padding:2px 6px;text-transform:uppercase;flex:none}
.cmdrow .k.g{background:rgba(57,199,223,.18);color:var(--cyan)}
.cmdrow .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cmdrow .d{color:var(--dim);font-size:12px;flex:none;max-width:40%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cmdhint{padding:9px 15px;color:var(--dim);font:600 11px ui-monospace,Menlo,monospace;border-top:1px solid var(--line)}
/* bottom controls */
.foot{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:9;display:flex;gap:8px}
.foot button,.foot a{border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:700 11px ui-monospace,Menlo,monospace;letter-spacing:1px;color:var(--dim);text-decoration:none}
.foot button:hover,.foot a:hover{color:var(--cyan);border-color:var(--cyan)}
#toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--card2);border:1px solid var(--cyan);color:var(--ink);border-radius:12px;padding:10px 16px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#setup{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:70;background:rgba(4,7,10,.92)}
#setup input{background:var(--card2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:10px 12px;width:min(420px,86vw);font:14px ui-monospace,Menlo}
#setup button{background:var(--cyan);border:0;color:#07141a;font-weight:800;border-radius:8px;padding:10px 18px}
.hint{color:var(--dim);font-size:12px}
</style></head>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const flat=v=>{if(v==null)return'';if(Array.isArray(v))return v.map(x=>x&&typeof x==='object'?(x.name||''):x).filter(Boolean).join(', ');if(typeof v==='object')return v.name||'';return String(v);};
const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayISO=()=>isoOf(new Date());
const tomorrowISO=()=>{const d=new Date();d.setDate(d.getDate()+1);return isoOf(d);};
const cleanName=t=>(t.name||'').replace(/\s*\(V\d+-\d+\)\s*$/i,'').trim()||'(untitled)';
const LS=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}};
const SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
let cfg={}; try{cfg=JSON.parse(localStorage.getItem('tb.cfg')||'{}');}catch(e){}
cfg.baseId=cfg.baseId||'appdDTNBbVrp6hVOv'; cfg.tableId=cfg.tableId||'tblLpOdHqxoP3siYk';
let aug={}; try{aug=JSON.parse(localStorage.getItem('tb.aug')||'{}');}catch(e){}
const A=id=>aug[id]||(aug[id]={}); const saveAug=()=>SV('tb.aug',aug);
let order=LS('tb.radialOrder',{}); const saveOrder=()=>SV('tb.radialOrder',order);
const CAL_TABLE='tblTL2OeN8b1k2J8W', RESPOND_TABLE='tblcpvr8BdkjSutU2', DN_TABLE='tblfAeWMfvocVGxZk';
const atUrl=()=>'https://api.airtable.com/v0/'+cfg.baseId+'/'+encodeURIComponent(cfg.tableId);
let tasks=[], calendar=[], respond=[], wx=LS('m.wx',[]), demo=false;
const daysOpen=t=>t.createdTime?Math.floor((Date.now()-new Date(t.createdTime))/864e5):0;
function sectionOf(t){ const a=A(t.id); return (a.section||t.sectionRemote||'').toLowerCase()||defaultSection(t); }
function defaultSection(t){ if(t.slotRemote==='morning')return'morning'; if(t.slotRemote==='afternoon')return'afternoon'; if(t.typeRemote==='call'||/^\s*call\b/i.test(t.name||''))return'calls'; return'backlog'; }
const isOpen=t=>(t.status||'Open')==='Open';
const snoozed=t=>A(t.id).snoozeUntil>Date.now();
const live=t=>isOpen(t)&&!snoozed(t)&&sectionOf(t)!=='parked';
const score=t=>(t.priorityRemote||0)+(A(t.id).priAdj||0)+daysOpen(t);
const hasStale=list=>Array.isArray(list)&&list.some(t=>t&&!t._mtg&&daysOpen(t)>=14);
const PAL=['#39c7df','#5eead4','#67E8F9','#60A5FA','#A78BFA','#818CF8','#34D399','#2dd4bf','#7dd3fc','#c4b5fd','#4ADE80','#38bdf8'];
const projColor=p=>{ if(!p) return '#5e7a84'; let h=0; for(const c of String(p).toUpperCase()) h=(h*31+c.charCodeAt(0))>>>0; return PAL[h%PAL.length]; };
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(window._tt); window._tt=setTimeout(()=>t.classList.remove('show'),1700); }

const CAT={ focus:['◎','Now / Focus'], attention:['△','Need Attention'], priority:['▲','Priority'], meeting:['▣','Meeting'], respond:['↩','Respond'],
  calls:['☎︎','Calls'], morning:['☀︎','Morning'], afternoon:['◑','Afternoon'], incoming:['▽','Incoming'],

function applyOrder(key,list){ const o=order[key]; if(!o||!o.length) return list; const pos={}; o.forEach((id,i)=>pos[id]=i); return list.slice().sort((a,b)=>((pos[a.id]==null?1e9:pos[a.id])-(pos[b.id]==null?1e9:pos[b.id]))); }
let _if={}; function clearIF(){ _if={}; }
function itemsFor(key){ if(key in _if) return _if[key]; return (_if[key]=_compute(key)); }
function _compute(key){ const L=sec=>tasks.filter(t=>live(t)&&sectionOf(t)===sec);
  switch(key){
    case 'focus': return applyOrder('focus',L('focus'));
    case 'priority': return applyOrder('priority', tasks.filter(t=>live(t)&&!A(t.id).notPriority).sort((a,b)=>score(b)-score(a)).slice(0,20));
    case 'incoming': return applyOrder('incoming', L('incoming'));
    case 'still': return applyOrder('still', tasks.filter(t=>live(t)&&daysOpen(t)>=10&&!t.project&&!t.lead).sort((a,b)=>daysOpen(b)-daysOpen(a)));
    case 'attention': return tasks.filter(t=>live(t)&&daysOpen(t)>=14).sort((a,b)=>daysOpen(b)-daysOpen(a));
    case 'morning': case 'afternoon': case 'calls': return applyOrder(key, L(key).sort((a,b)=>daysOpen(a)-daysOpen(b)));
    case 'nextup': return applyOrder('nextup', tasks.filter(t=>live(t)&&(sectionOf(t)==='nextup'||t.nextUp)).sort((a,b)=>((a.nuOrder??1e9)-(b.nuOrder??1e9))));
    case 'respond': return respond;
    case 'meeting': return todayMtgItems();
    default: return applyOrder(key,L(key));
  } }

const CONF_CALLS=[[510,540,'🌅 8:30 conference call','8:30–9:00 AM'],[900,930,'☀️ Afternoon call','3:00–3:30 PM']];
function mtgEnd(e){ const m=String(e.when||'').split(/[–—-]/)[1]; if(m){ const r=m.match(/(\d{1,2})(?::(\d\d))?\s*(AM|PM)?/i); if(r){ let h=+r[1]%12, mm=+(r[2]||0); const ap=(r[3]||'').toUpperCase(); if(ap==='PM'||(!ap&&h<7)) h+=12; const v=h*60+mm; if(v>(e.sort||0)) return v; } } return (e.sort||0)+30; }
function meetingsToday(day){ const list=calendar.filter(e=>e.date===day).map(e=>Object.assign({},e,{start:+e.sort||0,end:mtgEnd(e)}));
  const dw=new Date(day+'T12:00:00').getDay();
  if(dw>=1&&dw<=5){ CONF_CALLS.forEach(([s,e,t,when])=>{ const isDp=x=>/dialpad/i.test((x.link||'')+' '+(x.location||''));
    const hit=list.find(x=>x.start<e&&x.end>s)||list.find(x=>isDp(x)&&Math.abs(x.start-s)<=90);
    if(hit){ if(!hit.link||isDp(hit)||/^tel:/i.test(hit.link)){ hit.link=CONF_ROOM; hit.conf=1; } return; }
    list.push({title:t,when,date:day,sort:s,start:s,end:e,location:'Dialpad · dial-in 917-268-3365',link:CONF_ROOM,conf:1}); }); }
  return list.sort((a,b)=>a.start-b.start); }
function nowNext(day){ const d=new Date(), cur=d.getHours()*60+d.getMinutes(); const L=meetingsToday(day);
  const now=L.filter(e=>e.start-5<=cur&&cur<e.end); const next=L.find(e=>e.start>cur&&!now.includes(e)); return {now:now[0]||null,next:next||null,L}; }
function joinHref(e){ if(e.link&&/^(https?:|tel:)/i.test(e.link)) return e.link; const digits=(e.location||'').replace(/[^\d]/g,''); return digits.length>=10?'tel:'+digits:''; }

/* layout: position core + bubbles in a ring (computed once per render / resize — cheap) */
function layout(){ const st=$('#stage'); const W=st.clientWidth, H=st.clientHeight, CX=W/2, CY=H/2+8;
  { const ml=$('#cML'), tl=$('#cTL'), bl=$('#cBL'); if(ml&&tl&&bl){ const top=tl.offsetTop+tl.offsetHeight+10, bot=bl.offsetTop-10; ml.style.top=top+'px'; ml.style.height=Math.max(120,bot-top)+'px'; ml.style.transform='none'; }
    const cl=$('#cqPane .cqlist'), tr=$('#cTR'), br=$('#cBR'); if(cl&&tr&&br){ cl.style.maxHeight='300px'; const over=tr.offsetTop+tr.offsetHeight+10-br.offsetTop; if(over>0) cl.style.maxHeight=Math.max(70,300-over)+'px'; } }
  const m=Math.min(W,H); const CS=Math.max(176,Math.min(286,m*0.25)); const BS=Math.max(104,Math.min(140,m*0.135)); const R=Math.min(W,H)*0.34;
  const core=$('#core'); core.style.width=core.style.height=CS+'px'; core.style.left=(CX-CS/2)+'px'; core.style.top=(CY-CS/2)+'px';
  const r1=$('#ring1'), r2=$('#ring2'); const D1=R*2+BS*0.2, D2=CS+40;
  r1.style.width=r1.style.height=D1+'px'; r1.style.left=(CX-D1/2)+'px'; r1.style.top=(CY-D1/2)+'px';
  r2.style.width=r2.style.height=D2+'px'; r2.style.left=(CX-D2/2)+'px'; r2.style.top=(CY-D2/2)+'px';
  const bs=$('#bubbles').children, n=bs.length; const axis=[-Math.PI/2,0,Math.PI/2,Math.PI], spread=24*Math.PI/180;
  for(let i=0;i<n;i++){ const b=bs[i]; const a=axis[Math.floor(i/2)%4]+((i%2)?1:-1)*spread;
    let left=CX+R*Math.cos(a)-BS/2, top=CY+R*Math.sin(a)-BS/2;
    left=Math.max(6,Math.min(W-BS-6,left)); top=Math.max(50,Math.min(H-BS-54,top));
    b.style.width=b.style.height=BS+'px'; b.style.left=left+'px'; b.style.top=top+'px'; } }

$('#homeToggle').onclick=()=>{ if(localStorage.getItem('tb.landing')!=='grid')localStorage.setItem('tb.landing','grid'); else localStorage.removeItem('tb.landing'); updHome(); };
$('#keygo').onclick=()=>{ const k=$('#keyin').value.trim(); if(!k)return; cfg.apiKey=k; try{const c=JSON.parse(localStorage.getItem('tb.cfg')||'{}');c.apiKey=k;localStorage.setItem('tb.cfg',JSON.stringify(c));}catch(e){} $('#setup').style.display='none'; demo=false; fetchAll(); };
$('#demo').onclick=()=>{ $('#setup').style.display='none'; demo=true; demoData(); renderAll(); };
function boot(){ tick(); setInterval(tick,30000); updHome(); if(!cfg.apiKey) $('#setup').style.display='flex'; fetchAll(); setInterval(fetchAll,5*60000); }
boot();
</script></body></html>
