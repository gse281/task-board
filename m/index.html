<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Tasks</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tasks">
<meta name="theme-color" content="#0a1216">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="../task-editor.js"></script>

<script src="../guide.js"></script>

<script src="../photos.js"></script>
<script>
/* Deep links: /m/#morning, /m/#afternoon, /m/#review, /m/#notes.
   For the two calls, swap manifest + icon + title so "Add to Home Screen" makes a dedicated one-tap icon. */
(function(){ var h=(location.hash||'').slice(1).toLowerCase(); var M={morning:['AM Call','am'],afternoon:['PM Call','pm']}[h]; if(!M) return;
  document.querySelector('link[rel=manifest]').href='manifest-'+M[1]+'.webmanifest';
  document.querySelector('link[rel=apple-touch-icon]').href='icon-'+M[1]+'-180.png';
  document.querySelector('meta[name=apple-mobile-web-app-title]').content=M[0]; document.title=M[0]; })();
</script>
<link rel="icon" href="icon-192.png">
<style>
/* ============================================================
   Tasks — iPhone app for the Task Board (same Airtable data).
   Lives at /task-board/m/ ; the desktop dashboard is untouched.
   ============================================================ */
:root{
  --bg:#14110f; --panel:#1d1916; --panel2:#262019; --ink:#f5f3ee; --muted:#a8a29a; --dim:#6f6861;
  --line:#2c2723; --accent:#e8683c; --gold:#e0a458; --green:#3a8f5f; --callg:#30D158; --callink:#0b1a10; --red:#c2553f; --blue:#5b8fb0;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
::-webkit-scrollbar{display:none} *{scrollbar-width:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}
.hidden{display:none!important}

/* ---------- screens (iOS push navigation) ---------- */
#stack{position:fixed;inset:0;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);
  transition:transform .34s var(--ease), opacity .34s var(--ease);will-change:transform}
.screen.enter{transform:translateX(100%)}
.screen.under{transform:translateX(-28%);opacity:.5}
.screen.leave{transform:translateX(100%)}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 16px calc(28px + var(--sab))}

/* nav bar */
.nav{padding:calc(var(--sat) + 6px) 8px 6px;display:flex;align-items:center;flex-wrap:wrap;row-gap:2px;max-width:100%;min-height:calc(var(--sat) + 50px);gap:4px;flex:none}
.nav .back{display:flex;align-items:center;gap:2px;color:var(--accent);font-size:17px;padding:8px 8px;min-height:44px}
.nav .back svg{width:13px;height:21px}
.nav .ttl{flex:1;text-align:center;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.nav .icon{flex:none;min-width:40px;height:44px;display:grid;place-items:center;color:var(--accent);font-size:22px;border-radius:12px}
.nav .icon:active{background:var(--panel)}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px;margin:2px 4px 2px}
.sub{color:var(--muted);font-size:15px;margin:0 4px 16px}

/* ---------- home ---------- */
.calls{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:14px}
.call{position:relative;border-radius:16px;padding:8px 10px;min-height:54px;display:flex;flex-direction:row;align-items:center;gap:7px;
  text-align:left;overflow:hidden;transition:transform .12s}
.call:active{transform:scale(.97)}
.call.am{background:linear-gradient(150deg,#f0a35c 0%,#e8683c 55%,#b8452a 100%);color:#1a0e07}
.call.pm{background:linear-gradient(150deg,#f3d27a 0%,#e0a458 55%,#a8742f 100%);color:#1a1207}
.call .em{font-size:20px;line-height:1;flex:none}
.call .lbl{font-weight:800;font-size:15px;letter-spacing:-.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call .n{font-size:26px;font-weight:800;line-height:1;letter-spacing:-1px;flex:none}
.call .hint{font-size:13px;font-weight:600;opacity:.72}
.call.now::after{content:'NOW';position:static;flex:none;font-size:10px;font-weight:800;letter-spacing:.8px;
  background:rgba(0,0,0,.78);color:#fff;border-radius:8px;padding:3px 7px}
.sect{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin:0 4px 10px}
.views{display:flex;flex-direction:column;gap:12px;margin-bottom:26px}
.view{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--line);border-radius:20px;
  padding:18px 18px;min-height:84px;text-align:left;transition:transform .12s, background .12s}
.view:active{transform:scale(.98);background:var(--panel2)}
.view .vi{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;font-size:27px;flex:none}
.view .vt{flex:1;min-width:0}
.view .vn{font-size:21px;font-weight:700;letter-spacing:-.2px}
.view .vs{color:var(--muted);font-size:14px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--dim);font-size:22px;flex:none}
.minirow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 14px;text-align:left;min-height:64px}
.mini:active{background:var(--panel2)}
.mini b{display:block;font-size:22px}
.mini span{color:var(--muted);font-size:13px}
.foot{color:var(--dim);font-size:12px;text-align:center;margin-top:24px}
.foot a{color:var(--muted)}

/* ---------- group list ---------- */
.searchbox{position:sticky;top:0;z-index:2;background:var(--bg);padding:2px 0 10px}
.search{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:17px;outline:none}
.search::placeholder{color:var(--dim)}
.glist{background:var(--panel);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.grow{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:58px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.grow:last-child{border-bottom:0}
.grow:active{background:var(--panel2)}
.grow .gn{flex:1;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow .gn.none{color:var(--muted);font-weight:500;font-style:italic}
.grow .gc{min-width:34px;text-align:center;font-weight:700;font-size:15px;background:var(--panel2);border-radius:10px;padding:4px 9px;color:var(--gold)}
.grow .gc.hot{background:var(--accent);color:#1a0e07}

/* ---------- deck (one task at a time) ---------- */
.deckwrap{flex:1;position:relative;padding:4px 16px 0;display:flex;flex-direction:column;min-height:0}
.progress{display:flex;align-items:center;gap:10px;margin:0 4px 12px;color:var(--muted);font-size:14px;font-weight:600}
.bar{flex:1;height:5px;background:var(--panel2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s var(--ease)}
.cardzone{flex:1;position:relative;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
.tcard{position:relative;min-height:min(46vh,380px);max-height:100%;background:#fbfaf7;color:#1b1714;border-radius:26px;padding:22px 22px 18px;
  display:flex;flex-direction:column;box-shadow:0 18px 50px rgba(0,0,0,.45);touch-action:none;will-change:transform}
.tcard.back{transform:scale(.94) translateY(14px);opacity:.55;filter:brightness(.8)}
.tcard .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{font-size:13px;font-weight:700;border-radius:9px;padding:5px 10px;background:#efe9df;color:#5d5146;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip.p{background:#1b1714;color:#fbfaf7}
.chip.slot{background:#fde3d4;color:#9c3d17}
.chip.old{background:#f6d9d2;color:#9b3b28}
.tcard .tname{font-size:29px;line-height:1.16;font-weight:800;letter-spacing:-.5px;word-break:break-word}
.tcard .meta{color:#7b7067;font-size:14px;margin-top:10px}
.tcard .bodyx{flex:1;overflow:auto;margin-top:14px;min-height:0}
.upnext{margin:18px 4px 0}
.upnext .h{color:var(--muted);font-size:13px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;margin:0 2px 8px}
.upnext button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 14px;min-height:52px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
.upnext button:active{background:var(--panel2)}
.upnext .un{flex:1;min-width:0;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upnext .ud{color:var(--dim);font-size:13px;flex:none}
.tcard .ns{background:#f3eee6;border-radius:14px;padding:12px 14px;font-size:16px;line-height:1.4;margin-bottom:10px}
.tcard .ns b{display:block;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:#9a8e83;margin-bottom:3px}
.tcard .quick{display:flex;gap:8px;margin-top:12px}
.qbtn{flex:1;white-space:nowrap;padding:0 6px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;min-height:50px;font-weight:700;font-size:16px;background:#efe9df;color:#3b322b;text-decoration:none}
.qbtn:active{filter:brightness(.92)}
.qbtn.qcall{background:var(--callg);color:var(--callink)}
.stamp{display:none;position:absolute;top:26px;font-size:24px;font-weight:900;letter-spacing:1px;padding:6px 14px;border-radius:12px;border:4px solid;opacity:0;pointer-events:none;transform:rotate(-12deg)}
.stamp.done{left:22px;color:var(--green);border-color:var(--green)}
.stamp.snz{right:22px;color:#b07a1c;border-color:#b07a1c;transform:rotate(12deg)}
.stamp.skip{left:50%;top:auto;bottom:90px;transform:translateX(-50%);color:#5b8fb0;border-color:#5b8fb0}
.actions{display:grid;grid-template-columns:1fr .8fr 1.25fr;gap:10px;padding:8px 16px calc(12px + var(--sab));flex:none}
.act{min-height:76px;font-size:16px!important;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:14px;transition:transform .1s}
.act:active{transform:scale(.95)}
.act .ai{font-size:24px;line-height:1}
.act.snz{background:var(--panel2);color:var(--gold)}
.act.nxt{background:var(--panel2);color:#9cc3dc}
.act.dn{background:var(--green);color:#fff;font-size:16px}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;color:var(--muted);padding:30px}
.empty .big2{font-size:64px}
.empty h2{margin:0;color:var(--ink);font-size:26px}
.pill{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 22px;font-weight:700;color:var(--ink);min-height:50px}
.pill.acc{background:var(--accent);border-color:var(--accent);color:#1a0e07}

/* agenda (list) view inside a deck */
.agenda .row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:60px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.agenda .row:last-child{border-bottom:0}
.agenda .row:active{background:var(--panel2)}
.agenda .row3{padding-left:8px}
.agenda .num{width:26px;height:26px;border-radius:13px;background:var(--panel2);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);flex:none}
.agenda .rt{flex:1;min-width:0}
.agenda .rn{font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.agenda .rm{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agenda .ck{width:44px;height:44px;border-radius:22px;border:2px solid var(--dim);flex:none;display:grid;place-items:center;color:transparent;font-size:20px}
.agenda .ck:active{border-color:var(--green);background:var(--green);color:#fff}

/* ---------- review board: one project, all subs ---------- */
.review{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:22px;padding:16px 18px;min-height:86px;margin-bottom:26px;
  background:linear-gradient(135deg,#2a2320,#1d1916);border:1px solid #3a2f28;position:relative;overflow:hidden;transition:transform .12s}
.review:active{transform:scale(.98)}
.review .ri{width:52px;height:52px;border-radius:16px;background:var(--accent);display:grid;place-items:center;font-size:26px;color:#1a0e07;flex:none}
.review .rn{font-size:21px;font-weight:800;letter-spacing:-.2px}
.review .rs{color:var(--muted);font-size:14px;margin-top:2px}
.ring{position:relative;width:44px;height:44px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:800;color:var(--ink)}
.chips2{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;flex:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.pchip{flex:none;display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap;scroll-snap-align:center;transition:all .2s}
.pchip i{font-style:normal;color:var(--gold);font-size:12px}
.pchip.on{background:var(--accent);border-color:var(--accent);color:#1a0e07}
.pchip.on i{color:#1a0e07}
.pchip.clear{opacity:.45;text-decoration:line-through}
.bhead{padding:4px 20px 12px;flex:none}
.bhead .bt{font-size:30px;font-weight:800;letter-spacing:-.5px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bhead .bs{color:var(--muted);font-size:14px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
.bhead .bs span b{color:var(--ink)}
.bscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 12px 18px}
.bpage{animation:none}
.bpage.inL{animation:inL .28s var(--ease)} .bpage.inR{animation:inR .28s var(--ease)}
@keyframes inL{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(-40px);opacity:0}to{transform:none;opacity:1}}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden}
.sech{display:flex;align-items:center;gap:10px;width:100%;padding:0 14px;min-height:52px;text-align:left}
.sech:active{background:var(--panel2)}
.sech .cv{color:var(--dim);font-size:13px;transition:transform .22s var(--ease);width:14px}
.sec.shut .sech .cv{transform:rotate(-90deg)}
.sech .sn{flex:1;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sech .sn.none{color:var(--muted);font-style:italic;font-weight:600}
.sech .sc{font-weight:800;font-size:13px;color:var(--gold);background:var(--panel2);border-radius:9px;padding:3px 9px}
.sech .sall{font-size:12px;font-weight:700;color:var(--green);border:1px solid #2c4d3a;border-radius:9px;padding:5px 9px}
.secb{display:grid;grid-template-rows:1fr;transition:grid-template-rows .26s var(--ease)}
.sec.shut .secb{grid-template-rows:0fr}
.secb>div{overflow:hidden;min-height:0}
.rw{position:relative;border-top:1px solid var(--line);overflow:hidden;transition:max-height .3s var(--ease),opacity .25s;max-height:400px}
.rw .bgL,.rw .bgR{position:absolute;left:0;right:0;top:0;height:100%;opacity:0;display:flex;align-items:center;padding:0 22px;font-weight:800;font-size:15px}
.rw .bgL{background:var(--green);color:#fff}
.rw .bgR{background:#b07a1c;color:#fff;justify-content:flex-end}
.row3{position:relative;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;min-height:60px;background:var(--panel);touch-action:pan-y;will-change:transform}
.tick{width:40px;height:40px;border-radius:20px;border:2.5px solid #5a524b;flex:none;display:grid;place-items:center;color:transparent;font-size:19px;font-weight:900;transition:all .18s}
.tick:active{transform:scale(.88)}
.rw.gone .tick{background:var(--green);border-color:var(--green);color:#fff;transform:scale(1.12)}
.rw.gone .tn{text-decoration:line-through;color:var(--muted)}
.rw.gone{max-height:0!important;opacity:0;transition-delay:.25s}
.rw.snzd{max-height:0!important;opacity:0}
.tt{flex:1;min-width:0}
.tn{font-weight:600;font-size:16px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tm{color:var(--muted);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm .o{color:#d9826d}
.tsnz{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:19px;background:var(--panel2)}
.tsnz:active{transform:scale(.9)}
.tx{display:grid;grid-template-rows:0fr;transition:grid-template-rows .24s var(--ease);background:#171412}
.rw.open .tx{grid-template-rows:1fr}
.tx>div{overflow:hidden;min-height:0}
.txi{padding:10px 12px 12px 60px;font-size:14px;color:#d8d2ca}
.txi .nx{margin-bottom:8px;line-height:1.4}
.txi .nx b{color:var(--muted);font-size:11px;letter-spacing:.6px;text-transform:uppercase;display:block}
.txb{display:flex;flex-wrap:wrap;gap:6px}
.txb button,.txb a{min-height:38px;padding:0 12px;border-radius:11px;background:var(--panel2);font-weight:700;font-size:13.5px;display:inline-flex;align-items:center;gap:5px;color:var(--ink);text-decoration:none}
.txb .on{outline:2px solid var(--accent)}
.bbar{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:10px;padding:10px 16px calc(12px + var(--sab));flex:none;border-top:1px solid var(--line);background:rgba(20,17,15,.96)}
.bbar button{min-height:54px;border-radius:17px;font-weight:800;font-size:15px;background:var(--panel2)}
.bbar button:active{transform:scale(.96)}
.bbar .fm{background:var(--accent);color:#1a0e07}
.bbar button:disabled{opacity:.35}
.cleared{text-align:center;padding:40px 20px;color:var(--muted)}
.cleared div{font-size:54px}
/* ---- study-drill feel: streak, score, colour-coded projects, brief cards, flash feedback, stats ---- */
.streak{display:inline-flex;align-items:center;gap:3px;padding:4px 11px;border-radius:20px;font-weight:800;font-size:14px;background:#1e3a5f;border:1px solid #3B82F6;color:#fff;white-space:nowrap}
.streak.hot{background:#FF6B35;border-color:#FF9A00}
.streak.pop{animation:popk .35s var(--ease)}
.score{font:600 13px ui-monospace,Menlo,monospace;color:#CBD5E1;white-space:nowrap}
.statsbtn{flex:none;font:700 11px ui-monospace,Menlo,monospace;letter-spacing:.5px;color:#CBD5E1;border:1px solid #334155;border-radius:8px;padding:7px 10px;min-height:34px}
.drill{background:#0f0d0c;border:1px solid var(--line);border-radius:20px;padding:14px 0 14px;margin-bottom:22px}
.drill .dh{font:700 11px ui-monospace,Menlo,monospace;letter-spacing:2px;color:#FF6B35;margin:0 16px 10px}
.drill .chips2{padding:0 14px 12px}
.pchip .dot{width:8px;height:8px;border-radius:4px;display:inline-block}
.cta{display:block;width:calc(100% - 28px);margin:0 14px;min-height:58px;border-radius:14px;background:linear-gradient(135deg,#FF6B35,#E85D04);color:#fff;font:800 17px ui-monospace,Menlo,monospace;letter-spacing:2px}
.cta:active{transform:scale(.98)}
.brief{position:relative;border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--pc);background:color-mix(in srgb,var(--pc) 10%,#14110f);min-height:min(46vh,380px)}
.brief .bk{font:800 11px ui-monospace,Menlo,monospace;letter-spacing:2px;color:var(--pc)}
.brief .bn{font-size:30px;font-weight:800;letter-spacing:-.5px}
.brief .bl{display:flex;flex-wrap:wrap;gap:8px}
.brief .bl span{background:#ffffff10;border-radius:10px;padding:6px 10px;font-size:14px;font-weight:600}
.brief .bx{color:#d8d2ca;font-size:15px;line-height:1.5}

/* snapshot */

.dialer{margin:10px 0 6px}

.wxrow{display:grid;grid-template-columns:1fr auto auto 54px;align-items:center;gap:10px;padding:11px 6px;border-bottom:1px solid var(--line)}

.sl:active{background:var(--panel2)}

.ccrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}

.selbar{display:flex;align-items:center;gap:8px;margin:10px 2px 2px}.selbar .seln{font-weight:800;font-size:13.5px;color:#39c7df;margin-right:auto}.selbar .seln.z{color:var(--muted);font-weight:600}
.selbar button{min-height:36px;padding:0 12px;border-radius:10px;border:1px solid rgba(57,199,223,.3);background:transparent;color:#cfeaf1;font-weight:700;font-size:13px}

.invbar{position:absolute;left:0;right:0;bottom:0;z-index:5;padding:10px 12px calc(10px + var(--sab));background:linear-gradient(180deg,rgba(7,20,26,0),rgba(7,20,26,.96) 30%);display:flex;gap:8px;transform:translateY(110%);transition:transform .2s}

<body>
<div id="stack"></div>
<div id="toast"><span class="tm"></span><button class="hidden" id="undoBtn">Undo</button></div>

<script>
const BUILD='2026-10-15 12:36';   // stamped by deploy.sh
/* ============================================================
   Data model — shares the desktop dashboard's conventions:
   Items table: Task, Project, SBLead (lead), Sub (sub-category),
   MeetingSlot (morning/afternoon), Section, Status, DoDate,
   Phone, NextStep, Notes, Priority.
   ============================================================ */
const LS_CFG='tb.cfg', LS_AUG='tb.aug', LS_CACHE='m.tasks', LS_TS='m.ts';
const cfg=load(LS_CFG,{}); cfg.baseId=cfg.baseId||'appdDTNBbVrp6hVOv'; cfg.tableId=cfg.tableId||'tblLpOdHqxoP3siYk';
let aug=load(LS_AUG,{});
let tasks=load(LS_CACHE,[]);
let lastSync=+localStorage.getItem(LS_TS)||0;
let syncing=false, demo=false;

function load(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)||'null'); return v==null?d:v; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
const A=id=>(aug[id]=aug[id]||{});
const saveAug=()=>save(LS_AUG,aug);
const flat=v=>{ if(v==null)return''; if(Array.isArray(v))return v.map(x=>x&&typeof x==='object'?(x.name||''):x).filter(Boolean).join(', '); if(typeof v==='object')return v.name||''; return String(v); };
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cleanName=t=>(t.name||'').replace(/\s*\(V\d+-\d+\)\s*$/i,'').trim()||'(untitled)';
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const isoIn=days=>{const d=new Date(Date.now()+days*864e5);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const daysOpen=t=>t.createdTime?Math.floor((Date.now()-new Date(t.createdTime))/864e5):0;

function isOpen(t){ return (t.status||'Open')==='Open'; }
// Snoozed = snoozed on this phone, or scheduled for a later day (desktop snooze pushes DoDate out too).
function snoozed(t){ const a=A(t.id); if(a.snoozeUntil>Date.now()) return true; const dd=t.doDate||''; return !!dd && dd>todayISO(); }
// "Parked" = set aside in purgatory (Section='parked'): hidden from every live list but not gone.
function isParked(t){ return ((A(t.id).section||t.sectionRemote||'').toLowerCase())==='parked'; }
function live(t){ return isOpen(t) && !snoozed(t) && !isParked(t); }
function parkedTasks(){ return tasks.filter(t=>isOpen(t)&&isParked(t)).sort((a,b)=>new Date(b.createdTime||0)-new Date(a.createdTime||0)); }
function park(t){ A(t.id).section='parked'; t.sectionRemote='parked'; saveAug(); save(LS_CACHE,tasks); patch(t.id,{Section:'parked'}); }
function unpark(t){ A(t.id).section=null; t.sectionRemote=''; saveAug(); save(LS_CACHE,tasks); patch(t.id,{Section:''}); }   // clears Section → falls back to its call slot (MeetingSlot) or normal views
// Call lists only hide what was explicitly snoozed, so a future DoDate never drops an item off a call.
function liveCall(t){ return isOpen(t) && !(A(t.id).snoozeUntil>Date.now()) && !isParked(t); }
// Same rule the desktop uses: Section wins, then MeetingSlot.
function slotOf(t){ const s=(A(t.id).section||t.sectionRemote||'').toLowerCase(); if(s==='morning'||s==='afternoon') return s; if(s) return ''; return t.slotRemote==='morning'||t.slotRemote==='afternoon'?t.slotRemote:''; }
function score(t){ return (t.priorityRemote||0)*100 + daysOpen(t); }

const DIMS={
  project:{label:'Project', plural:'Projects', field:'Project', icon:'🏗', tint:'#3a2a1f'},
  lead:   {label:'Lead',    plural:'Leads',    field:'SBLead',  icon:'👤', tint:'#1f2a33'},
  sub:    {label:'Sub-category', plural:'Sub-categories', field:'Sub', icon:'🏷', tint:'#23301f'},
};
const SLOTS={ morning:{label:'Morning call', em:'🌅'}, afternoon:{label:'Afternoon call', em:'☀️'} };

/* ---------- Airtable ---------- */
const atUrl=()=>'https://api.airtable.com/v0/'+cfg.baseId+'/'+encodeURIComponent(cfg.tableId);
const FIELDS=['Task','Project','SBLead','Sub','Status','MeetingSlot','Section','DoDate','Phone','NextStep','Notes','Priority','Type','UpdatedAt','TextExclude','LeadStatus','RoniFlag','TextCount','ReminderAt','ListOrder','CallContact','NextUp','NextUpOrder','SuggestedDate','SuggestReason'];
async function fetchAll(){
  if(!cfg.apiKey){ if(!tasks.length){ tasks=demoTasks(); demo=true; } render(); return; }
  if(syncing) return; syncing=true; paintSync();
  try{
    let offset, out=[], guard=0;
    do{
      const u=new URL(atUrl()); u.searchParams.set('pageSize','100');
      u.searchParams.set('filterByFormula',"OR({Status}='Open',{Status}=BLANK())");
      FIELDS.forEach(f=>u.searchParams.append('fields[]',f));
      if(offset) u.searchParams.set('offset',offset);
      const r=await fetch(u,{headers:{Authorization:'Bearer '+cfg.apiKey}});
      if(!r.ok){ toast('Airtable error '+r.status+(r.status===401?' — check token in ⚙︎':'')); break; }
      const d=await r.json();
      out=out.concat((d.records||[]).map(rec=>{ const f=rec.fields; return {
        id:rec.id, createdTime:rec.createdTime, name:flat(f.Task), project:flat(f.Project).trim(), lead:flat(f.SBLead).trim(), sub:flat(f.Sub).trim(),
        status:flat(f.Status)||'Open', slotRemote:flat(f.MeetingSlot).toLowerCase(), sectionRemote:flat(f.Section).toLowerCase(),
        doDate:flat(f.DoDate).slice(0,10), phone:flat(f.Phone), callWho:flat(f.CallContact), priorityRaw:flat(f.Priority), nextUp:flat(f.NextUp).slice(0,10), nuOrder:(f.NextUpOrder==null?null:+f.NextUpOrder), sugDate:flat(f.SuggestedDate).slice(0,10), sugWhy:flat(f.SuggestReason), sugX:flat(f.SuggestDismissed).slice(0,10), next:flat(f.NextStep), notes:flat(f.Notes), guide:flat(f.Guide), guideStep:+f.GuideStep||0, photos:Array.isArray(f.Photos)?f.Photos:[],
        priorityRemote:+flat(f.Priority)||0, type:flat(f.Type).toLowerCase(), updatedAt:flat(f.UpdatedAt),
        remindAt:flat(f.ReminderAt), listOrder:(f.ListOrder==null?null:+f.ListOrder), textEx:!!f.TextExclude, leadStatus:flat(f.LeadStatus), flag:!!f.RoniFlag, textCount:+f.TextCount||0 }; }));
      offset=d.offset;
      if(!offset){ tasks=out; demo=false; lastSync=Date.now(); save(LS_CACHE,tasks); localStorage.setItem(LS_TS,lastSync);
        for(const t of tasks){ const a=aug[t.id]; if(a&&a.section&&!((Date.now()-(a.secAt||0))<180000)) a.section=null; if(a&&a.loAt){ if(Date.now()-a.loAt<180000) t.listOrder=a.lo; else { delete a.lo; delete a.loAt; } } } save(LS_CACHE,tasks); saveAug(); }
    }while(offset && ++guard<60);
  }catch(e){ toast('Offline — showing saved list'); }
  syncing=false; render();
  sweepNotes(false); dnArchive(); fetchAutos(false); fetchDrafts(); fetchCallContacts(); fetchUsage(); homeLayLoad();
}

/* ---------- ⚙️ AUTOMATIONS — always on the home screen (feed: Airtable Automations table, refreshed every 2h
   by the automations-status scheduled task + each task's own end-of-run report) ---------- */
const AUTO_TABLE='tblDBZXPxzKDKVKJh';
let autoRows=load('m.autos',[]), autoBusy=false;
const AUTO_C={OK:'#3a8f5f',Failing:'#e5533a',Missed:'#e0a458',Paused:'#6f6861',Manual:'#5b8fb0',Unknown:'#a8a29a'};
async function fetchAutos(force){
  if(demo||!cfg.apiKey||autoBusy) return; if(!force && Date.now()-(+localStorage.getItem('m.autosAt')||0)<10*60000) return;
  autoBusy=true;
  try{ const u=new URL('https://api.airtable.com/v0/'+cfg.baseId+'/'+AUTO_TABLE); u.searchParams.set('pageSize','100');
    const r=await fetch(u,{headers:{Authorization:'Bearer '+cfg.apiKey}}); if(r.ok){ const d=await r.json();
      autoRows=(d.records||[]).map(x=>{ const f=x.fields; return {name:f.Name||f.TaskId||'',id:f.TaskId||'',kind:flat(f.Kind)||'Task',purpose:f.Purpose||'',schedule:f.Schedule||'',
        last:f.LastRun||'',next:f.NextRun||'',status:flat(f.Status)||'Unknown',detail:f.Detail||'',sent:f.Sent||0,replied:f.Replied||0,noreply:f.NoReply||0,updated:f.Updated||''}; });
      save('m.autos',autoRows); localStorage.setItem('m.autosAt',Date.now()); } }catch(e){}
  autoBusy=false; stack.forEach(x=>{ if(x.route.type==='home') paintHome(x); if(x.route.type==='autos') paintAutos(x); });
}
/* ============================================================
   👥 CALL INVITES — contacts for the daily calls (Airtable CallContacts), one tap = text them the dial-in.
   Invite opens Messages with the text prefilled (you press Send). Invite all = one group text.
   ============================================================ */
const CC_TABLE='tblLl5Wb4vJK8xGBs';
const DIAL_IN_DEFAULT='917-268-3365';
let DIAL_IN=localStorage.getItem('m.dialin2')||DIAL_IN_DEFAULT;
const dialTel=()=>'tel:+1'+DIAL_IN.replace(/\D/g,'').slice(-10);
/* ---------- 📅 Meetings (Airtable Calendar table — today + tomorrow, with join links) ---------- */
const CAL_TABLE='tblTL2OeN8b1k2J8W';
const tomorrowISO=()=>{const d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
let calendar=load('m.calendar',[]);
async function fetchCalendar(){
  if(!cfg.apiKey) return calendar;
  try{ const u=new URL('https://api.airtable.com/v0/'+cfg.baseId+'/'+CAL_TABLE); u.searchParams.set('pageSize','100');
    u.searchParams.set('filterByFormula','OR({Date}="'+todayISO()+'",{Date}="'+tomorrowISO()+'")');
    const r=await fetch(u,{headers:{Authorization:'Bearer '+cfg.apiKey}}); if(!r.ok) return calendar; const d=await r.json();
    calendar=(d.records||[]).map(rec=>({title:flat(rec.fields.Title),when:flat(rec.fields.When),date:flat(rec.fields.Date),sort:+flat(rec.fields.Sort)||0,location:flat(rec.fields.Location),link:flat(rec.fields.Link)}));
    save('m.calendar',calendar);
  }catch(e){}
  return calendar;
}
const todayMeetings=()=>calendar.filter(e=>e.date===todayISO()).sort((a,b)=>a.sort-b.sort);

// ── NOW / NEXT meeting (shared logic: Airtable Calendar table + the two daily conference calls) ──
// Sort = start minutes from midnight; end parsed from "When" (e.g. "11:30 AM–12:00 PM"), else start+30.
// Weekday 8:30 AM and 3:00 PM conference calls (▶ Join = Dialpad room; small dial-in 917-268-3365, no PIN) are added unless the calendar already has a meeting then.
const CONF_TEL='tel:+19172683365';
const CONF_ROOM='https://meetings.dialpad.com/room/rbenjamini';
const CONF_CALLS=[[510,540,'🌅 8:30 conference call','8:30–9:00 AM'],[900,930,'☀️ Afternoon call','3:00–3:30 PM']];   // weekday 8:30 AM + 3:00 PM
function mtgEnd(e){ const m=String(e.when||'').split(/[–—-]/)[1]; if(m){ const r=m.match(/(\d{1,2})(?::(\d\d))?\s*(AM|PM)?/i); if(r){ let h=+r[1]%12, mm=+(r[2]||0); const ap=(r[3]||'').toUpperCase(); if(ap==='PM'||(!ap&&h<7)) h+=12; const v=h*60+mm; if(v>(e.sort||0)) return v; } } return (e.sort||0)+30; }
function meetingsToday(cal,day){
  const list=cal.filter(e=>e.date===day).map(e=>Object.assign({},e,{start:+e.sort||0,end:mtgEnd(e)}));
  const dw=new Date(day+'T12:00:00').getDay();
  if(dw>=1&&dw<=5){ CONF_CALLS.forEach(([s,e,t,when])=>{
    // Dedupe: a calendar meeting overlapping the slot, or a Dialpad-room meeting within 90 min, IS this call → show it once, with Join → Dialpad.
    const isDp=x=>/dialpad/i.test((x.link||'')+' '+(x.location||''));
    const hit=list.find(x=>x.start<e&&x.end>s)||list.find(x=>isDp(x)&&Math.abs(x.start-s)<=90);
    if(hit){ if(!hit.link||isDp(hit)||/^tel:/i.test(hit.link)){ hit.link=CONF_ROOM; hit.dial=CONF_TEL; hit.conf=1; } return; }
    list.push({title:t,when,date:day,sort:s,start:s,end:e,location:'Dialpad · dial-in 917-268-3365 (no PIN)',link:CONF_ROOM,dial:CONF_TEL,conf:1}); }); }
  return list.sort((a,b)=>a.start-b.start);
}
function nowNext(cal,day){ const d=new Date(), cur=d.getHours()*60+d.getMinutes(); const L=meetingsToday(cal,day);
  const now=L.filter(e=>e.start-5<=cur&&cur<e.end); const next=L.find(e=>e.start>cur&&!now.includes(e)); return {now,next,cur}; }
const hhmm=m=>{ let h=Math.floor(m/60), mm=m%60; const ap=h>=12?'PM':'AM'; h=h%12||12; return h+(mm?':'+String(mm).padStart(2,'0'):'')+' '+ap; };
// Dialpad room: ▶ Join = the room link (opens the Dialpad Meetings app if installed — shows who's on); small "dial-in" = tel, no PIN.

const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');

const CALL_STOP=new Set(['call','calls','re','about','with','the','and','to','for','back','text','follow','up','followup','fu','on','in','of','at','pm','am','me','him','her','them','ask','check','tell','get','x2','x3','asap','today','tomorrow','again']);
function callMatch(t){
  if(t.callWho==='-') return null;                                   // cleared: no contact, no guess
  if(t.phone) return {phone:t.phone,who:t.callWho||t.lead||'',sure:true};
  if(!contacts.length) return null;
  const words=cleanName(t).toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!CALL_STOP.has(w)&&!/^\d+$/.test(w));
  const qs=[]; if(t.lead) qs.push(t.lead.toLowerCase()); for(let i=0;i<words.length-1;i++) qs.push(words[i]+' '+words[i+1]); words.forEach(w=>qs.push(w));
  for(const q of qs){ const hits=searchContacts(q).filter(c=>(c.p||[]).length); if(!hits.length) continue;
    const exact=hits.find(c=>(c.n||'').toLowerCase().split(/\s+/)[0]===q.split(' ')[0]);
    if(hits.length<=3||exact){ const c=exact||hits[0]; return {phone:c.p[0],who:c.n,sure:false}; } }   // any Contacts match is a guess until picked/saved
  return null;

function inferTrade(n){ n=String(n||'').toLowerCase(); const T=[[/1\s*oak|gustavo|sam mari|\brke\b/,'1oak'],[/sprinkler|fire supp/,'21 Fire Suppression'],[/plumb/,'22 Plumbing'],[/hvac|mechanical|\bcms\b|coil/,'23 HVAC'],[/elec/,'26 Electrical'],[/tele|low volt|cabling|\bav\b/,'27 Communications'],[/fire alarm/,'28 Fire Alarm'],[/concrete|foundation/,'03 Concrete'],[/mason|brick|stone/,'04 Masonry'],[/steel|metal|iron/,'05 Metals / Steel'],[/millwork|cabinet|carpent|wood/,'06 Wood / Millwork'],[/roof|waterproof|decoflex|insulation/,'07 Thermal & Moisture'],[/window|glass|storefront|alumtec|door/,'08 Openings'],[/drywall|tile|floor|paint|panel|finish|green global/,'09 Finishes'],[/elevator|conveying/,'14 Conveying'],[/landscap|site|excavat|paving/,'31-33 Sitework']];
  for(const [re,t] of T) if(re.test(n)) return t; return 'Other'; }
const rosterAll=()=>callCts.filter(c=>c.active);
const callContacts=slot=>rosterAll().filter(c=>slot==='all'||c.slots.includes(slot));
function rosterGroups(list){ const g=new Map(TRADES.map(t=>[t,[]])); list.forEach(c=>{ const t=TRADES.includes(c.trade)?c.trade:'Other'; g.get(t).push(c); }); g.forEach(v=>v.sort((a,b)=>a.name.localeCompare(b.name))); return [...g.entries()].filter(([,v])=>v.length); }

          <a class="ccinv" href="${smsOne(c.phone,msg)}"${cuA(c.name)} data-inv="${c.id}">Invite</a></div>`).join('')}</div>`; }).join('')

  wire(el); el.querySelectorAll('[data-is]').forEach(x=>x.onclick=()=>{ if(x.dataset.is===r.slot) return; r.slot=x.dataset.is; const sc=el.querySelector('.scroll'); if(sc) sc.scrollTop=0; s._st=0; buzz(6); paintInvite(s); });
  const mark=ids=>{ const m=load('m.invited.'+todayISO(),{}); const now=Date.now(); ids.forEach(i=>m[i]=now); save('m.invited.'+todayISO(),m); setTimeout(()=>paintInvite(s),600); };
  { const sc=el.querySelector('.scroll'); if(sc){ sc.scrollTop=st0; s._st=st0; sc.addEventListener('scroll',()=>{ s._st=sc.scrollTop; },{passive:true}); } }   // keep his place across Invite taps, returning from Messages and sync re-renders
  el.querySelectorAll('[data-sel]').forEach(b=>b.onclick=e=>{ e.preventDefault(); e.stopPropagation(); const p=b.dataset.sel; if(sel[p])delete sel[p]; else sel[p]=1; saveSel(); buzz(5); paintInvite(s); });
  el.querySelectorAll('[data-selclear]').forEach(b=>b.onclick=()=>{ for(const k in sel)delete sel[k]; saveSel(); buzz(6); paintInvite(s); });
  { const b=el.querySelector('[data-selall]'); if(b) b.onclick=()=>{ list.forEach(c=>sel[c.phone]=1); saveSel(); buzz(8); paintInvite(s); }; }
  el.querySelectorAll('[data-gsel]').forEach(b=>b.onclick=()=>{ const g=G.find(x=>x[0]===b.dataset.gsel); if(!g) return; const allOn=g[1].every(c=>sel[c.phone]); g[1].forEach(c=>{ if(allOn) delete sel[c.phone]; else sel[c.phone]=1; }); saveSel(); buzz(6); paintInvite(s); });
  { const sc=el.querySelector('.scroll'), top=el.querySelector('[data-invtop]'), bar=el.querySelector('[data-invbar]'); if(sc&&top&&bar){ const chk=()=>bar.classList.toggle('show',top.offsetTop+top.offsetHeight<sc.scrollTop+4); sc.addEventListener('scroll',chk,{passive:true}); requestAnimationFrame(chk); } }
  el.querySelectorAll('[data-inv]').forEach(a=>a.addEventListener('click',()=>{ buzz(8); mark([a.dataset.inv]); }));
  el.querySelectorAll('[data-ginv]').forEach(a=>a.addEventListener('click',()=>{ buzz(10); const g=G.find(x=>x[0]===a.dataset.ginv); if(g){ g[1].forEach(c=>useContact(c.name,c.phone)); mark(g[1].map(c=>c.id)); } }));
  el.querySelectorAll('[data-invgo]').forEach(a=>a.addEventListener('click',()=>{ buzz(12); (selN?selected:list).forEach(c=>useContact(c.name,c.phone)); mark((selN?selected:list).map(c=>c.id)); }));
  // AM / PM flags on the one roster
  el.querySelectorAll('[data-flag]').forEach(b=>b.onclick=async()=>{ const c=callCts.find(x=>x.id===b.dataset.fid); if(!c) return; const f=b.dataset.flag; const prev=c.slots.slice();
    c.slots=c.slots.includes(f)?c.slots.filter(x=>x!==f):[...c.slots,f]; save('m.callcts',callCts); buzz(6); paintInvite(s); if(stack[0]) paintHome(stack[0]);
    toast((c.slots.includes(f)?'Added to ':'Removed from ')+(f==='morning'?'AM':'PM')+' call', async()=>{ c.slots=prev; save('m.callcts',callCts); paintInvite(s); await ccPatch(c.id,{Slots:prev}); }); await ccPatch(c.id,{Slots:c.slots}); });
  // trade: tap to set (clears the ≈ guess)
  el.querySelectorAll('[data-trade]').forEach(b=>b.onclick=()=>{ const c=callCts.find(x=>x.id===b.dataset.trade); if(!c) return;
    sheet(`<h3>Trade · ${esc(c.name)}</h3><div style="max-height:56vh;overflow:auto">${TRADES.map(t=>`<button class="sbtn${t===c.trade?' on':''}" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div><button class="sbtn cancel" data-close>Cancel</button>`,(sh,close)=>{
      sh.querySelectorAll('[data-t]').forEach(x=>x.onclick=async()=>{ const prev={t:c.trade,g:c.guess}; c.trade=x.dataset.t; c.guess=false; save('m.callcts',callCts); close(); paintInvite(s);
        toast('Trade: '+c.trade, async()=>{ c.trade=prev.t; c.guess=prev.g; save('m.callcts',callCts); paintInvite(s); await ccPatch(c.id,{Trade:prev.t||null,TradeGuess:prev.g}); });
        await ccPatch(c.id,{Trade:c.trade,TradeGuess:false}); }); }); });
  // long-press a name → remove from the roster (Active off; undo)
  el.querySelectorAll('.ccrow').forEach(row=>{ let lp=null; row.addEventListener('touchstart',e=>{ if(e.target.closest('button,a')) return; lp=setTimeout(()=>{ lp=null; const c=callCts.find(x=>x.id===row.dataset.id); if(!c) return; buzz(15);
      sheet(`<h3>${esc(c.name)}</h3><button class="sbtn" data-rmr>Remove from the invite roster</button><button class="sbtn cancel" data-close>Cancel</button>`,(sh,close)=>{ sh.querySelector('[data-rmr]').onclick=async()=>{ close(); c.active=false; save('m.callcts',callCts); paintInvite(s); if(stack[0]) paintHome(stack[0]);
        toast('Removed '+c.name, async()=>{ c.active=true; save('m.callcts',callCts); paintInvite(s); await ccPatch(c.id,{Active:true}); }); await ccPatch(c.id,{Active:false}); }; }); },550); },{passive:true});
    const cl=()=>{ clearTimeout(lp); lp=null; }; row.addEventListener('touchmove',cl,{passive:true}); row.addEventListener('touchend',cl); });
  el.querySelector('[data-dial]').onclick=()=>sheet(`<h3>Conference dial-in</h3><input class="field" id="di" value="${esc(DIAL_IN)}"><div class="row2"><button class="pill" data-close>Cancel</button><button class="pill acc" data-ok>Save</button></div>`,(sh,close)=>{
    sh.querySelector('[data-ok]').onclick=()=>{ DIAL_IN=sh.querySelector('#di').value.trim()||DIAL_IN_DEFAULT; localStorage.setItem('m.dialin2',DIAL_IN); close(); paintInvite(s); }; });

  const addTo=async(name,ph)=>{ if(!name||!ph) return; const flags=slot==='all'?['morning','afternoon']:[slot];
    const ex=callCts.find(c=>c.phone.replace(/\D/g,'').slice(-10)===ph.replace(/\D/g,'').slice(-10));
    if(ex){ ex.slots=[...new Set([...ex.slots,...flags])]; ex.active=true; save('m.callcts',callCts); paintInvite(s); await ccPatch(ex.id,{Slots:ex.slots,Active:true}); return; }
    const tr=inferTrade(name); const c={id:'tmp'+Date.now(),name,phone:ph,slots:flags,active:true,trade:tr,guess:true}; callCts.push(c); save('m.callcts',callCts); paintInvite(s);
    if(cfg.apiKey){ try{ const rr=await fetch(ccUrl(),{method:'POST',headers:{Authorization:'Bearer '+cfg.apiKey,'Content-Type':'application/json'},body:JSON.stringify({records:[{fields:{Name:name,Phone:ph,Slots:flags,Active:true,Source:'iPhone app',Trade:tr,TradeGuess:true}}],typecast:true})});

      <input class="field" id="cxs" placeholder="🔍 Search your contacts…" type="search" autocomplete="off">

        cxr.querySelectorAll('.addpick').forEach(row=>row.onclick=()=>{ buzz(8); close(); addTo(row.dataset.n,row.dataset.p); }); };
      cxs.addEventListener('input',draw); if(!contacts.length&&contactsTry()) loadContacts().then(draw);
      sh.querySelector('[data-ok]').onclick=()=>{ const name=sh.querySelector('#cn').value.trim(), ph=sh.querySelector('#cp').value.trim(); if(!name||!ph){ toast('Enter a name and number'); return; } close(); addTo(name,ph); }; });

async function ccPatch(id,fields){ if(demo||!cfg.apiKey||String(id).startsWith('tmp')) return; try{ await fetch(ccUrl()+'/'+id,{method:'PATCH',headers:{Authorization:'Bearer '+cfg.apiKey,'Content-Type':'application/json'},body:JSON.stringify({fields,typecast:true})}); }catch(e){} }

/* ============================================================
   📲 REVIEW LEAD TEXTS — the 7:20 AM drafter writes each lead's top 3 to Airtable LeadDrafts (Pending review).
   Here Roni swaps / re-rolls / edits / drops items, skips a lead, or approves. The sender task (every 15 min,
   7–11:45 AM) sends ONLY Approved drafts. Anything still pending at noon expires and is never sent.
   ============================================================ */
const LD_TABLE='tblHzC255a8nJGJjp';
let drafts=load('m.drafts',[]), ldBusy=false;
const ldUrl=()=>'https://api.airtable.com/v0/'+cfg.baseId+'/'+LD_TABLE;
const pastNoon=()=>new Date().getHours()>=12;
const draftsPending=()=>drafts.filter(d=>d.day===todayISO()&&d.status==='Pending review'&&!pastNoon());
async function fetchDrafts(force){
  if(demo||!cfg.apiKey||ldBusy) return; if(!force&&Date.now()-(+localStorage.getItem('m.draftsAt')||0)<5*60000) return; ldBusy=true;
  try{ const u=new URL(ldUrl()); u.searchParams.set('pageSize','100'); u.searchParams.set('filterByFormula',"{Day}='"+todayISO()+"'");
    const r=await fetch(u,{headers:{Authorization:'Bearer '+cfg.apiKey}});
    if(r.ok){ const d=await r.json(); drafts=(d.records||[]).map(x=>{ const f=x.fields; let lines=[]; try{ lines=JSON.parse(f.Lines||'[]'); }catch(e){}
      return {id:x.id,lead:f.Lead||'',first:f.FirstName||'',phone:f.Phone||'',day:f.Day||'',status:flat(f.Status)||'Pending review',lines,message:f.Message||'',sentAt:f.SentAt||''}; });
      save('m.drafts',drafts); localStorage.setItem('m.draftsAt',Date.now()); } }catch(e){}
  ldBusy=false; stack.forEach(x=>{ if(x.route.type==='home') paintHome(x); if(x.route.type==='leadrev') paintLeadRev(x); });
}
function draftMessage(d){ return 'Good morning '+(d.first||d.lead)+' — today’s top '+(d.lines.length===3?'3':d.lines.length)+':\n'+d.lines.map((l,i)=>(i+1)+'. '+(l.flag?'⭐ ':'')+l.text).join('\n')+'\nReply with the # and a quick update (e.g. "1 done", "2 waiting on X"). Thanks – Roni'; }
const lineFor=t=>{ const p=(t.project||'').split(',')[0].trim(); return (p?p+' – ':'')+(t.next||cleanName(t))+(t.textCount>=2?' (follow-up #'+t.textCount+')':''); };
function leadPool(d){ const used=new Set(d.lines.map(l=>l.id)); return tasks.filter(t=>isOpen(t)&&t.lead===d.lead&&!t.textEx&&t.leadStatus!=='Says done'&&!used.has(t.id)).sort((a,b)=>(b.next?1:0)-(a.next?1:0)||((b.flag?200:0)+(b.priorityRemote||30))-((a.flag?200:0)+(a.priorityRemote||30))); }
async function saveDraft(d,extra){
  d.message=draftMessage(d); save('m.drafts',drafts);
  if(demo||!cfg.apiKey) return;
  const fields=Object.assign({Lines:JSON.stringify(d.lines),Message:d.message,Items:d.lines.map(l=>l.id).filter(x=>/^rec/.test(x))},extra||{});
  try{ const r=await fetch(ldUrl()+'/'+d.id,{method:'PATCH',headers:{Authorization:'Bearer '+cfg.apiKey,'Content-Type':'application/json'},body:JSON.stringify({fields,typecast:true})}); if(!r.ok) toast('Save failed '+r.status); }catch(e){ toast('Offline — not saved'); }
}
function setDraftStatus(d,st){ d.status=st; const extra={Status:st}; if(st==='Approved') extra.ApprovedAt=new Date().toISOString(); saveDraft(d,extra); }
function paintLeadRev(s){
  const el=s.el; const today=drafts.filter(d=>d.day===todayISO()); const keep=el.querySelector('.scroll'); const st=keep?keep.scrollTop:0;
  const pending=today.filter(d=>d.status==='Pending review'); const late=pastNoon();
  const card=d=>{ const locked=d.status!=='Pending review'||late; const tag={'Pending review':late?'expired at noon':'waiting for you',Approved:'✓ approved — sends shortly',Skipped:'skipped today',Sent:'✓ sent',Failed:'⚠︎ failed',Expired:'expired'}[d.status]||d.status;
    return `<div class="ldcard ${locked?'locked':''} st-${d.status.replace(/\s/g,'')}" data-d="${d.id}"><div class="ldh"><b>${esc(d.first||d.lead)}</b><span class="ap">${esc(d.lead)} · ${esc(d.phone)}</span><span class="ldst">${esc(tag)}</span></div>
      ${d.lines.map((l,i)=>`<div class="ldl" data-i="${i}"><span class="ldn">${i+1}</span><div class="ldt" ${locked?'':'data-edit'}>${l.flag?'⭐ ':''}${esc(l.text)}</div>${locked?'':`<button data-swap title="Swap">⇄</button><button data-drop title="Drop">✕</button>`}</div>`).join('')}
      ${locked?'':`<div class="ldacts"><button data-addl>＋ Item</button><button data-roll>🎲 Re-roll</button><button data-skip>Skip today</button><button class="ldok" data-ok>✓ Approve</button></div>`}
      <details class="ldprev"><summary>Preview text</summary><pre>${esc(draftMessage(d))}</pre></details></div>`; };
  el.innerHTML=`<div class="nav">${backBtn('Tasks')}<div class="ttl">📲 Lead texts</div>${pending.length&&!late?'<button class="statsbtn" data-okall>APPROVE ALL</button>':''}<button class="icon" data-ld aria-label="Reload">↻</button></div>
    <div class="scroll" style="padding:0 12px calc(20px + var(--sab))"><div class="ap" style="margin:2px 4px 12px">${late?'After noon — anything not approved has expired and will not be sent.':'Nothing goes out until you approve it. Approved texts send within 15 min (until 11:45 AM).'}</div>
    ${today.length?today.map(card).join(''):'<div class="empty" style="padding-top:50px"><div class="big2">📲</div><h2>No drafts today</h2><p style="color:var(--dim);padding:0 24px">Drafts appear around 7:20 AM on weekdays.</p></div>'}</div>`;
  wire(el); const sc=el.querySelector('.scroll'); if(keep) sc.scrollTop=st;
  el.querySelector('[data-ld]').onclick=()=>{ toast('Reloading…'); fetchDrafts(true); };
  { const a=el.querySelector('[data-okall]'); if(a) a.onclick=()=>{ pending.forEach(d=>{ if(d.lines.length) setDraftStatus(d,'Approved'); }); buzz(15); celebrate(innerWidth/2,innerHeight/3,16); paintLeadRev(s); paintHome(stack[0]); }; }
  el.querySelectorAll('.ldcard').forEach(c=>{ const d=drafts.find(x=>x.id===c.dataset.d); if(!d) return; const redraw=()=>{ saveDraft(d); paintLeadRev(s); };
    c.querySelectorAll('[data-edit]').forEach(t=>t.onclick=()=>{ const i=+t.closest('.ldl').dataset.i; sheet(`<h3>Edit wording</h3><textarea class="field" rows="4">${esc(d.lines[i].text)}</textarea><div class="row2"><button class="pill" data-close>Cancel</button><button class="pill acc" data-ok>Save</button></div>`,(sh,close)=>{
      const ta=sh.querySelector('textarea'); setTimeout(()=>ta.focus(),300); sh.querySelector('[data-ok]').onclick=()=>{ const v=ta.value.trim(); if(v) d.lines[i].text=v; close(); redraw(); }; }); });
    c.querySelectorAll('[data-drop]').forEach(b=>b.onclick=()=>{ const i=+b.closest('.ldl').dataset.i; const gone=d.lines.splice(i,1)[0]; redraw(); toast('Dropped', ()=>{ d.lines.splice(i,0,gone); redraw(); }); });

/* ============================================================
   DAILY NOTES — same pages as the desktop 🗒 Notes panel (Airtable AppNotes, Key='scratch:YYYY-MM-DD').
   Today always opens blank; ‹ › walks back through past days; nothing is ever overwritten by the rollover.

const DN_TABLE='tblfAeWMfvocVGxZk';
const dnLabel=day=>day===todayISO()?'Today':new Date(day+'T12:00:00').toLocaleDateString(undefined,{weekday:'long',month:'short',day:'numeric'});

const dnRid={};
function dnPut(day,text){ const L=dnLocal(); L[day]=text; save('m.days',L); }
async function dnSave(day,text){
  dnPut(day,text); if(demo||!cfg.apiKey) return 'local';
  const body={fields:{Key:'scratch:'+day,Text:text,Updated:new Date().toLocaleString()}}; const H={Authorization:'Bearer '+cfg.apiKey,'Content-Type':'application/json'};
  try{ if(dnRid[day]){ const r=await fetch('https://api.airtable.com/v0/'+cfg.baseId+'/'+DN_TABLE+'/'+dnRid[day],{method:'PATCH',headers:H,body:JSON.stringify(body)}); return r.ok?'saved':'error'; }
    const r=await fetch('https://api.airtable.com/v0/'+cfg.baseId+'/'+DN_TABLE,{method:'POST',headers:H,body:JSON.stringify({records:[body],typecast:true})});
    if(!r.ok) return 'error'; const d=await r.json(); dnRid[day]=d.records[0].id; return 'saved'; }catch(e){ return 'error'; }
}
async function dnLoad(day){

  try{ const u=new URL('https://api.airtable.com/v0/'+cfg.baseId+'/'+DN_TABLE); u.searchParams.set('pageSize','5'); u.searchParams.set('filterByFormula',"{Key}='scratch:"+day+"'");
    const r=await fetch(u,{headers:{Authorization:'Bearer '+cfg.apiKey}}); if(!r.ok) return L[day]||''; const d=await r.json(); const rec=(d.records||[])[0];
    if(rec){ dnRid[day]=rec.id; const txt=rec.fields.Text||''; if(!txt&&L[day]){ dnSave(day,L[day]); return L[day]; } dnPut(day,txt); return txt; }

async function loadDnDays(){

    offset=d.offset; }while(offset&&++g<100);
  }catch(e){ return notesArc; }
  const seen=new Set(); notesArc=out.filter(n=>!n.uid||(!seen.has(n.uid)&&seen.add(n.uid))).sort((a,b)=>b.at.localeCompare(a.at));
  save('m.notes',notesArc); return notesArc;
}
async function createLogs(rows){
  const made=[];

    try{ const r=await fetch(logUrl(),{method:'POST',headers:{Authorization:'Bearer '+cfg.apiKey,'Content-Type':'application/json'},body:JSON.stringify({records:rows.slice(i,i+10),typecast:true})});
      if(r.ok){ const d=await r.json(); made.push(...d.records); } }catch(e){}
  }
  for(const x of made){ const f=x.fields; notesArc.unshift({id:x.id,at:f['Event Date'],text:f.Details,item:(f.Item||[])[0],name:f['Event Name'],uid:f.UID,full:f.NewValue,src:f.Source}); }

}

// Catch notes edited anywhere else (desktop, Airtable) — log only what's new since the last snapshot.
let sweeping=false;
async function sweepNotes(force){
  if(demo||!cfg.apiKey||sweeping) return; if(!force && Date.now()-(+localStorage.getItem('m.sweepAt')||0)<3600e3) return;
  sweeping=true;
  try{
    await fetchNotes();
    const last=new Map(); for(const n of notesArc){ if(!n.item) continue; const p=last.get(n.item); if(!p||n.at>p.at) last.set(n.item,n); }
    const rows=[];
    for(const t of tasks){
      const full=(t.notes||'').trim(); if(!full||String(t.id).startsWith('tmp')) continue;
      const h=hash(full), p=last.get(t.id);
      if(p && (p.uid||'').endsWith(':'+h)) continue;
      const prev=(p&&p.full||'').trim();
      let added=full; if(prev && full.startsWith(prev)) added=full.slice(prev.length).trim();
      if(!added) continue;
      const when=p? (t.updatedAt&&t.updatedAt>p.at?t.updatedAt:new Date().toISOString()) : (t.updatedAt||t.createdTime);
      rows.push(noteRow(t,added,full,when,p?'sweep':'backfill',prev));
    }
    if(rows.length){ const n=await createLogs(rows); if(n) toast('📝 Archived '+n+' note'+(n===1?'':'s')); }
    localStorage.setItem('m.sweepAt',Date.now());
  }finally{ sweeping=false; if(stack[0]) paintHome(stack[0]); }
}

/* ---------- session score (study-drill style): streak = decisions in a row; Next/skip breaks it ---------- */
const PAL=['#39c7df','#5eead4','#67E8F9','#60A5FA','#A78BFA','#818CF8','#34D399','#2dd4bf','#7dd3fc','#c4b5fd','#4ADE80','#38bdf8'];
const projColor=p=>{ if(!p) return '#94A3B8'; let h=0; for(const c of String(p).toUpperCase()) h=(h*31+c.charCodeAt(0))>>>0; return PAL[h%PAL.length]; };
function sess(){ let x=load('m.sess',null); if(!x||x.date!==todayISO()) x={date:todayISO(),done:0,snz:0,skip:0,streak:0,best:(x&&x.best)||0,byProj:{},items:[]}; x.items=x.items||[]; if(!Array.isArray(x.sk)){ x.sk=[]; } x.streak=x.sk.length; return x; }   // 🔥 number = exactly the ids in x.sk (one source)
function sessHit(kind,t,undo){ const x=sess(); const p=(t&&t.project)||'No project'; const bp=x.byProj[p]=x.byProj[p]||{done:0,snz:0,skip:0};
  const d=undo?-1:1; if(kind==='done'){x.done=Math.max(0,x.done+d); bp.done=Math.max(0,bp.done+d);} else if(kind==='snz'){x.snz=Math.max(0,x.snz+d); bp.snz=Math.max(0,bp.snz+d);} else {x.skip++; bp.skip++;}
  if(kind==='skip'&&!undo) x.sk=[];
  if(t&&(kind==='done'||kind==='snz')){ x.items=x.items.filter(i=>i.id!==t.id); x.sk=x.sk.filter(id=>id!==t.id); if(!undo){ x.items.push({id:t.id,kind,at:Date.now()}); x.sk.push(t.id); } }
  x.streak=x.sk.length; if(x.streak>x.best) x.best=x.streak;
  save('m.sess',x); document.querySelectorAll('[data-streak]').forEach(paintStreak); return x; }

function byListOrder(arr){ return arr.map((t,i)=>({t,i})).sort((a,b)=>((a.t.listOrder??1e9)-(b.t.listOrder??1e9))||a.i-b.i).map(x=>x.t); }

function groups(dim){

  return [...m].map(([k,n])=>({k,n})).sort((a,b)=> (a.k===''?1:0)-(b.k===''?1:0) || b.n-a.n || a.k.localeCompare(b.k));

/* ---------- navigation stack ---------- */
const stack=[]; const $stack=document.getElementById('stack');
function push(route){
  const el=document.createElement('div'); el.className=stack.length?'screen enter':'screen'; $stack.appendChild(el);
  const top=stack[stack.length-1]; stack.push({route,el});
  paint(stack[stack.length-1]);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.classList.remove('enter'); syncLayers(); }));
  paneGestures(el);
}
function pop(){
  if(stack.length<2) return; const cur=stack.pop(); const top=stack[stack.length-1];
  cur.el.classList.add('leave'); cur.el.classList.remove('dragy'); document.querySelectorAll('.pane-dim').forEach(x=>x.remove());
  syncLayers(); try{ paint(top); }catch(e){ console.error(e); }
  setTimeout(()=>{ cur.el.remove(); homeSafety(); },360);
  if(stack.length===1&&location.hash) history.replaceState(null,'',location.pathname+location.search);   // leaving a deep link → plain home
}
// Safety net: after any navigation the visible top screen must be clean (no stray transform/peek) and home must have content.
function homeSafety(){ stack.forEach((x,i)=>{ x.el.classList.remove('peek','dragy','enter'); if(i===stack.length-1){ x.el.classList.remove('leave','under'); x.el.style.transform=''; x.el.style.transition=''; } });
  [...$stack.children].forEach(c=>{ if(!stack.some(x=>x.el===c)&&!c.classList.contains('leave')) c.remove(); });
  const h=stack[0]; if(h&&h.route.type==='home'){ const sc=h.el.querySelector('.scroll'); if(!sc||sc.children.length<3){ try{ paintHome(h); }catch(e){ console.error(e); } } } }
// Only screens that are still UNDER the current top get the shifted 'under' look; the top one is always flush (fixes a stuck sideways-shifted home screen after fast navigation).
function syncLayers(){ stack.forEach((x,i)=>{ const isTop=i===stack.length-1; x.el.classList.toggle('under',!isTop); if(isTop){ x.el.classList.remove('enter','leave'); x.el.style.transform=''; } }); }
function goHome(){ while(stack.length>1){ const s=stack.pop(); s.el.remove(); } document.querySelectorAll('.pane-dim').forEach(x=>x.remove()); syncLayers(); paint(stack[0]); homeSafety(); }
function render(){ stack.forEach(paint); }
function paint(s){ const r=s.route; if(r.type==='home') paintHome(s); else if(r.type==='groups') paintGroups(s); else if(r.type==='deck') paintDeck(s); else if(r.type==='board') paintBoard(s); else if(r.type==='notes') paintNotes(s); else if(r.type==='stats') paintStats(s); else if(r.type==='snap') paintSnap(s); else if(r.type==='day') paintDay(s); else if(r.type==='incoming') paintIncoming(s); else if(r.type==='slotlist') paintSlotList(s); else if(r.type==='wx') paintWx(s); else if(r.type==='parked') paintParked(s); else if(r.type==='autos') paintAutos(s); else if(r.type==='comp') paintComp(s); else if(r.type==='invite') paintInvite(s); else if(r.type==='leadrev') paintLeadRev(s); else if(r.type==='meetings') paintMeetings(s); else if(r.type==='freq') paintFreq(s); else if(r.type==='nextup') paintNextUp(s); else if(r.type==='claudeq') paintClaudeQ(s); }
// Pane gestures (every pushed screen): pull DOWN at the top = close like an iOS sheet; swipe from the LEFT EDGE = back.
// Translate only (no fading). Release → finish (past threshold or fast flick) or snap back. touchcancel → snap back. Never leaves a stray transform.
function paneGestures(el){
  let x0=0,y0=0,t0=0,mode=null,d=0,below=null,dim=null,active=false;
  const scrolledDown=t=>{ for(let n=t;n&&n!==el.parentNode;n=n.parentElement){ if(n.scrollTop>0) return true; } return false; };
  const cleanup=()=>{ if(below){ below.classList.remove('peek'); below=null; } if(dim){ const x=dim; dim=null; x.style.transition='opacity .2s'; x.style.opacity='0'; setTimeout(()=>x.remove(),220); } el.classList.remove('dragy'); };
  const snapBack=()=>{ el.style.transition='transform .25s var(--ease)'; el.style.transform=''; setTimeout(()=>{ el.style.transition=''; },260); cleanup(); mode=null; active=false; };
  const finish=()=>{ const dir=mode; el.style.transition='transform .22s var(--ease)'; el.style.transform=dir==='y'?'translateY(100%)':'translateX(100%)'; if(dim){ dim.style.transition='opacity .22s'; dim.style.opacity='0'; }
    buzz(6); mode=null; active=false;
    setTimeout(()=>{ const i=stack.findIndex(x=>x.el===el); if(i>0&&i===stack.length-1){ stack.pop(); el.remove(); cleanup(); syncLayers(); try{ paint(stack[stack.length-1]); }catch(e){} if(stack.length===1&&location.hash) history.replaceState(null,'',location.pathname+location.search); } else { if(i<0) el.remove(); else el.style.transform=''; cleanup(); } homeSafety(); },230); };
  el.addEventListener('touchstart',e=>{ if(stack.length<2||stack[stack.length-1].el!==el||e.touches.length>1){ active=false; return; }
    const t=e.touches[0]; x0=t.clientX; y0=t.clientY; t0=Date.now(); d=0; mode=null;
    active=!e.target.closest('input,textarea,select,[data-drag],[data-hsh],.cartrack,.frq')&&!(scrolledDown(e.target)&&x0>=24); },{passive:true});
  el.addEventListener('touchmove',e=>{ if(!active) return; const t=e.touches[0]; const dx=t.clientX-x0, dy=t.clientY-y0;
    if(!mode){ if(Math.abs(dx)<8&&Math.abs(dy)<8) return;
      if(el.querySelector('.dragging')){ active=false; return; }                         // a row drag owns this touch
      if(x0<24&&dx>0&&Math.abs(dx)>Math.abs(dy)) mode='x';
      else if(dy>0&&Math.abs(dy)>Math.abs(dx)&&!scrolledDown(e.target)) mode='y';
      else { active=false; return; }
      const i=stack.findIndex(x=>x.el===el); below=i>0?stack[i-1].el:null; if(below) below.classList.add('peek');
      dim=document.createElement('div'); dim.className='pane-dim'; el.parentNode.insertBefore(dim,el); el.classList.add('dragy'); el.style.transition='none'; }
    e.preventDefault(); d=Math.max(0,mode==='y'?dy:dx); el.style.transform=mode==='y'?`translateY(${d}px)`:`translateX(${d}px)`;
    if(dim) dim.style.opacity=String(Math.max(0,.45*(1-d/(mode==='y'?innerHeight:innerWidth)))); },{passive:false});
  const end=()=>{ if(!active||!mode){ active=false; mode=null; return; } const v=d/Math.max(1,Date.now()-t0); const lim=mode==='y'?120:innerWidth*.3;
    if(d>lim||(v>0.6&&d>40)) finish(); else snapBack(); };
  el.addEventListener('touchend',end);
  el.addEventListener('touchcancel',()=>{ if(mode) snapBack(); active=false; mode=null; });   // iOS momentum / system edge gestures
}
// belt & braces: if anything is left mid-gesture (app backgrounded, etc.) restore a clean stack
function resetLayers(){ document.querySelectorAll('.pane-dim').forEach(x=>x.remove()); stack.forEach(x=>{ x.el.classList.remove('peek','dragy'); x.el.style.transition=''; x.el.style.transform=''; }); syncLayers(); }

// Drill launcher: once per app load, shuffle the project chips and pre-pick one at random — weighted toward projects with
// ⭐ flagged / overdue / ⏫ Next Up items, never the same as last time. ALL stays available at the end.
let drillPick=null;
function drillPrep(gs){ if(drillPick&&drillPick.n===gs.length) return drillPick; const td=todayISO(), last=localStorage.getItem('m.drillLastPick')||'';
  const w=g=>{ const L=groupTasks('project',g.k); return 1+L.filter(t=>t.flag).length*2+L.filter(t=>t.doDate&&t.doDate<td).length*2+L.filter(t=>t.nextUp).length*2+Math.min(3,L.length/5); };
  const order=gs.filter(g=>g.k).map(g=>({g,k:-Math.log(Math.random()||1e-9)/w(g)})).sort((a,b)=>a.k-b.k).map(x=>x.g);
  const pick=(order.find(g=>g.k!==last)||order[0]||{k:'*'}).k;
  localStorage.setItem('m.drillSel',pick); localStorage.setItem('m.drillLastPick',pick);
  return drillPick={n:gs.length,order:[...order,...gs.filter(g=>!g.k)]}; }
function drillChips(){ const gs0=groups('project'); const all=gs0.reduce((a,g)=>a+g.n,0); const gs=drillPrep(gs0).order.filter(g=>gs0.some(x=>x.k===g.k)); const sel=localStorage.getItem('m.drillSel')||'*';
  return gs.map(g=>`<button class="pchip ${sel===g.k?'on':''}" data-dsel="${esc(g.k)}"><span class="dot" style="background:${projColor(g.k)}"></span>${esc(g.k||'None')} <i>${g.n}</i></button>`).join('')+`<button class="pchip ${sel==='*'?'on':''}" data-dsel="*">ALL <i>${all}</i></button>`; }
function topNames(dim){ return groups(dim).filter(g=>g.k).slice(0,3).map(g=>g.k).join(', ')||'—'; }
function ago(ts){ const m=Math.round((Date.now()-ts)/6e4); return m<1?'just now':m<60?m+'m ago':Math.round(m/60)+'h ago'; }
function pullToRefresh(sc){
  const ptr=sc.querySelector('.ptr'); let y0=null,dy=0;
  sc.addEventListener('touchstart',e=>{ if(sc.scrollTop<=0){ y0=e.touches[0].clientY; dy=0; } },{passive:true});
  sc.addEventListener('touchmove',e=>{ if(y0==null) return; dy=e.touches[0].clientY-y0; if(dy>0){ ptr.style.height=Math.min(60,dy/2.2)+'px'; ptr.textContent=dy>120?'Release to refresh':'Pull to refresh'; } },{passive:true});
  sc.addEventListener('touchend',()=>{ if(y0==null) return; ptr.style.height='0'; if(dy>120) fetchAll(); y0=null; });
}

/* ---------- DECK: one task at a time ---------- */
function deckItems(r){
  if(r.kind==='slot') return slotTasks(r.slot);
  if(r.kind==='calls') return callTasks();
  if(r.kind==='group') return groupTasks(r.dim,r.val);
  if(r.kind==='today') return todayTasks();
  if(r.kind==='nextup') return nextUpList();
  if(r.kind==='ids') return (r.ids||[]).map(id=>tasks.find(t=>t.id===id)).filter(t=>t&&isOpen(t));
  if(r.kind==='drill'){ // grouped by project (biggest first), priority inside — like drilling one topic at a time
    const base=r.val==='*'?allLive():groupTasks('project',r.val); const cnt={}; base.forEach(t=>cnt[t.project||'']=(cnt[t.project||'']||0)+1);
    return base.slice().sort((a,b)=>(cnt[b.project||'']-cnt[a.project||''])||(a.project||'~').localeCompare(b.project||'~')||score(b)-score(a)); }
  return allLive();
}
// 🔀 Drill shuffle: fresh weighted-random order every session (stable inside it, so swipe-back works).
// Weight: ⏫ Next Up, ⭐ flagged, overdue show up more; cards seen first last session are pushed back.
function drillShuffle(list){ const last=new Set(load('m.drillLast',[])); const td=todayISO();
  const w=t=>(1+(t.nextUp?2:0)+(t.flag?2:0)+(t.doDate&&t.doDate<td?2:0))*(last.has(t.id)?0.2:1);
  return list.map(t=>({t,k:-Math.log(Math.random()||1e-9)/w(t)})).sort((a,b)=>a.k-b.k).map(x=>x.t); }
function paintDeck(s){
  const r=s.route, el=s.el;
  // Keep a stable queue for this session: tasks leave when handled, "Next" rotates to the back.
  if(s.list===undefined) s.list=!!r.list;
  const fresh=deckItems(r); const ids=new Set(fresh.map(t=>t.id));
  if(!s.queue){ s.queue=(r.kind==='drill'?drillShuffle(fresh):fresh).map(t=>t.id); if(r.kind==='drill') s.seen=new Set(fresh.map(t=>t.project||'').filter((p,i,a)=>r.val==='*')); if(r.startId&&s.queue.includes(r.startId)) s.queue=[r.startId,...s.queue.filter(x=>x!==r.startId)]; } else { s.queue=s.queue.filter(id=>ids.has(id)); fresh.forEach(t=>{ if(!s.queue.includes(t.id)) s.queue.push(t.id); }); }
  s.total=Math.max(s.total||0, s.queue.length+(s.handled||0));
  const byId=new Map(tasks.map(t=>[t.id,t]));
  const q=s.queue.map(id=>byId.get(id)).filter(Boolean);
  const isSlot=r.kind==='slot';

function cardInner(t,r){

  if(t.sub && !(r.kind==='group'&&r.dim==='sub')) chips.push(`<span class="chip">🏷 ${esc(t.sub)}</span>`);
  if(sl && r.kind!=='slot') chips.push(`<span class="chip slot">${SLOTS[sl].em} ${sl}</span>`);

    <div class="quick">
      ${ph?`<a class="qbtn qcall" href="tel:${esc(ph)}" onclick="event.stopPropagation()">📞 Call</a><a class="qbtn" href="sms:${esc(ph)}" onclick="event.stopPropagation()">💬</a>`:''}
      ${isSlotDeck?'':`<button class="qbtn" data-slotbtn="morning" style="${sl==='morning'?'outline:2px solid #39c7df':''}">🌅</button><button class="qbtn" data-slotbtn="afternoon" style="${sl==='afternoon'?'outline:2px solid #6fd0e0':''}">☀️</button>`}

function handle(s,t,kind,top){
  const fly={done:'translateX(130%) rotate(18deg)',snooze:'translateX(-130%) rotate(-18deg)',next:'translateY(-120%) scale(.9)',fwd:'translateX(-120%)',back:'translateX(120%)'}[kind] || 'translateX(-130%) rotate(-18deg)';
  if(top){ if(kind!=='fwd'&&kind!=='back') flash(top.parentElement,typeof kind==='number'?'snooze':kind); top.style.transition='transform .28s ease-in, opacity .28s'; top.style.transform=fly; top.style.opacity='0'; }
  setTimeout(()=>{
    if(kind==='done'){ done(t); s.queue=s.queue.filter(id=>id!==t.id); s.handled=(s.handled||0)+1; }
    else if(kind==='snooze'||typeof kind==='number'){ snooze(t,typeof kind==='number'?kind:10); s.queue=s.queue.filter(id=>id!==t.id); s.handled=(s.handled||0)+1; }
    else if(kind==='next'){ sessHit('skip',t); s.queue.push(s.queue.shift()); }
    else if(kind==='fwd'){ s.queue.push(s.queue.shift()); }        // swipe ← : just the next card (no done/snooze, streak untouched)
    else if(kind==='back'){ s.queue.unshift(s.queue.pop()); }      // swipe → : previous card
    paintDeck(s); if(stack[0]) paintHome(stack[0]);
  }, top?200:0);
}
// Card swipe = navigation only: ← next card, → previous card. Done / Snooze stay as the buttons below.
function swipe(card,cb){
  let x0,y0,dx=0,dy=0,on=false,lock=null;
  card.addEventListener('pointerdown',e=>{ if(e.target.closest('a,button')) return; on=true; lock=null; x0=e.clientX; y0=e.clientY; dx=dy=0; card.setPointerCapture(e.pointerId); card.style.transition='none'; });
  card.addEventListener('pointermove',e=>{ if(!on) return; dx=e.clientX-x0; dy=e.clientY-y0;
    if(!lock&&(Math.abs(dx)>8||Math.abs(dy)>8)) lock=Math.abs(dx)>Math.abs(dy)?'x':'y'; if(lock!=='x') return;
    card.style.transform=`translateX(${dx}px) rotate(${dx/40}deg)`; const arm=Math.abs(dx)>90; if(arm&&!card._arm) buzz(6); card._arm=arm; });
  const end=()=>{ if(!on) return; on=false; card.style.transition='transform .25s var(--ease)';
    if(lock==='x'&&dx<-90) cb('fwd'); else if(lock==='x'&&dx>90) cb('back'); else card.style.transform=''; };
  card.addEventListener('pointerup',end); card.addEventListener('pointercancel',end);
}
function paintAgenda(s,q){

        <div class="tm">${t.project?`<b style="color:${projColor(t.project)}">${esc(t.project)}</b> · `:''}${esc([t.lead,t.sub].filter(Boolean).join(' · '))}${t.lead||t.sub?' · ':''}${d>=21?`<span class="o">${d}d</span>`:d+'d'}${t.phone?' · 📞':''}</div></div>

  const sc=el.querySelector('.agenda'); sc.scrollTop=keep; sc.addEventListener('scroll',()=>{ s.agScroll=sc.scrollTop; },{passive:true});
  el.querySelectorAll('.rw').forEach(rw=>{

    const finish=kind=>{ rw.classList.add(kind==='done'?'gone':'snzd'); if(kind==='done') done(t); else snooze(t,10);
      s.queue=s.queue.filter(id=>id!==t.id); s.handled=(s.handled||0)+1; setTimeout(()=>{ paintDeck(s); if(stack[0]) paintHome(stack[0]); },kind==='done'?520:300); };
    rw.querySelector('.tick').onclick=e=>{ e.stopPropagation(); finish('done'); };

    let x0=null,y0=0,dx=0,lock=null,moved=false;
    row.addEventListener('click',e=>{ if(e.target.closest('button')||moved) return; buzz(5); editTask(t); });
    row.addEventListener('touchstart',e=>{ x0=e.touches[0].clientX; y0=e.touches[0].clientY; dx=0; lock=null; moved=false; row.style.transition='none'; },{passive:true});
    row.addEventListener('touchmove',e=>{ if(x0==null) return; const mx=e.touches[0].clientX-x0, my=e.touches[0].clientY-y0;
      if(lock==null&&(Math.abs(mx)>8||Math.abs(my)>8)) lock=Math.abs(mx)>Math.abs(my)?'x':'y'; if(lock!=='x') return;
      dx=mx; moved=true; row.style.transform=`translateX(${dx}px)`; rw.querySelector('.bgL').style.opacity=dx>0?1:0; rw.querySelector('.bgR').style.opacity=dx<0?1:0;
      if(Math.abs(dx)>90&&!row._b){ buzz(6); row._b=1; } if(Math.abs(dx)<90) row._b=0; },{passive:true});
    row.addEventListener('touchend',()=>{ if(x0==null) return; x0=null; row.style.transition='transform .22s var(--ease)';
      if(dx>90){ row.style.transform='translateX(110%)'; finish('done'); } else if(dx<-90){ row.style.transform='translateX(-110%)'; finish('snz'); }
      else { row.style.transform=''; setTimeout(()=>rw.querySelectorAll('.bgL,.bgR').forEach(b=>b.style.opacity=0),220); } setTimeout(()=>{moved=false;},60); });
  });
}

/* ---------- SNAPSHOT: entire open list, one dense line per task ----------
   Modes: Grouped (by project, biggest first, oldest first inside) · Oldest first · Newest first (flat). Tap a line → focus that task. */
function paintSnap(s){
  const r=s.route, el=s.el; const all=allLive();
  const keep=el.querySelector('.scroll'); const st=keep?keep.scrollTop:0;
  const q=(s.q||'').toLowerCase();
  const list=all.filter(t=>!q||[cleanName(t),t.project,t.lead,t.sub].join(' ').toLowerCase().includes(q));
  const line=t=>{ const d=daysOpen(t); return `<button class="sl" data-id="${t.id}"><span class="tg" style="background:${projColor(t.project)}">${esc(t.project||'—')}</span><span class="tk">${esc(cleanName(t))}</span><span class="ld">${esc(t.lead||'')}</span><span class="ag ${d>=60?'oo':d>=21?'o':''}">${d}d</span></button>`; };
  let body='';
  if(r.mode==='group'){
    const g=new Map(); list.forEach(t=>{ const k=t.project||''; if(!g.has(k)) g.set(k,[]); g.get(k).push(t); });
    body=[...g].sort((a,b)=>(a[0]===''?1:0)-(b[0]===''?1:0)||b[1].length-a[1].length).map(([k,ts])=>`<div class="sgh"><span class="d" style="background:${projColor(k)}"></span><b>${esc(k||'No project')}</b><span>${ts.length} · oldest ${Math.max(...ts.map(daysOpen))}d</span></div>`
      +ts.sort((a,b)=>daysOpen(b)-daysOpen(a)).map(line).join('')).join('');
  } else {
    body=list.slice().sort((a,b)=>r.mode==='old'?daysOpen(b)-daysOpen(a):daysOpen(a)-daysOpen(b)).map(line).join('');
  }
  if(!el.dataset.built){ el.dataset.built=1;
    el.innerHTML=`<div class="nav">${backBtn('Tasks')}<div class="ttl">Snapshot</div><span class="score" data-cnt></span><button class="icon" data-add aria-label="Add">＋</button></div>
      <div class="snaptools"><div class="seg">${[['group','By project'],['old','Oldest'],['new','Newest']].map(([k,l])=>`<button data-m="${k}">${l}</button>`).join('')}</div></div>
      <div style="padding:0 16px 8px;flex:none"><input class="search" type="search" placeholder="Filter…" autocomplete="off" style="padding:9px 12px;font-size:16px"></div>
      <div class="scroll" style="padding:0 10px calc(20px + var(--sab))"></div>`;
    wire(el);
    el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ r.mode=b.dataset.m; localStorage.setItem('m.snapMode',r.mode); buzz(5); el.querySelector('.scroll').scrollTop=0; paintSnap(s); });
    el.querySelector('.search').oninput=e=>{ s.q=e.target.value; paintSnap(s); };
    el.querySelector('[data-add]').onclick=()=>addSheet({},()=>paintSnap(s));
  }
  el.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===r.mode));
  el.querySelector('[data-cnt]').textContent=list.length+' open';
  const sc=el.querySelector('.scroll'); sc.innerHTML=body||`<div class="empty" style="padding-top:60px"><div class="big2">✨</div><h2>Nothing open</h2></div>`;
  if(keep) sc.scrollTop=st;
  sc.querySelectorAll('.sl').forEach(b=>b.onclick=()=>{ const t=tasks.find(x=>x.id===b.dataset.id); if(!t) return; buzz(5); editTask(t); });
}

  }
  el.querySelectorAll('[data-r]').forEach(b=>b.classList.toggle('on',b.dataset.r===r.range));
  const q=(r.q||'').trim().toLowerCase(); const byId=new Map(tasks.map(t=>[t.id,t]));
  const cut=r.range==='today'?todayISO():r.range==='7'?isoIn(-6):r.range==='30'?isoIn(-29):'';
  const list=notesArc.filter(n=>{ const day=localDay(n.at); if(cut&&day<cut) return false; if(!q) return true;

      +(list.length>lim?`<button class="pill" style="width:100%;margin-top:14px" data-more>Show more (${list.length-lim})</button>`:'')

    else toast(t?'That task is snoozed':'That task is closed — note kept in archive'); });
